name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Reject MedCora alias
        working-directory: .
        run: "! grep -rn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=docs --exclude-dir=.superpowers --exclude=ci.yml 'MedCora' . || (echo 'MedCora is a rejected alias (issue 12) - use MediCore' && exit 1)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
      - run: go build ./...
      - run: go test -race ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
      - run: pnpm turbo lint format:check type-check test build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
          # Firebase web config is not secret (client-visible by design); CI only
          # needs a syntactically valid value to satisfy defineEnv during the
          # shell's static build — real deployments inject the real project config.
          NEXT_PUBLIC_GIP_API_KEY: ci-build-key
          NEXT_PUBLIC_GIP_PROJECT_ID: ci-build-project
