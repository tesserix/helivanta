name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Reject MedCora alias
        working-directory: .
        run: "! grep -rn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=docs --exclude-dir=.superpowers --exclude=ci.yml 'MedCora' . || (echo 'MedCora is a rejected alias (issue 12) - use MediCore' && exit 1)"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
      - run: go build ./...
      - run: ./scripts/coverage-gate.sh
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # No NODE_AUTH_TOKEN: @tesserix/web is published to the PUBLIC npm
      # registry as of 2.x, and the repo-local .npmrc that used to force the
      # scope to GitHub Packages has been removed (#866). Keeping the token
      # here would be worse than redundant — this repo is on the GitHub Free
      # plan with no org secrets, so `secrets.PKG_READ_TOKEN` resolves to an
      # empty string and an authenticated fetch against GHCR 401s.
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint format:check type-check test build
        env:
          # Zitadel's client id and issuer are client-visible by design, so a
          # placeholder is fine here. Replaces NEXT_PUBLIC_GIP_* which #838
          # deleted along with Firebase.
          #
          # NOTE, verified rather than assumed: `next build` currently succeeds
          # with these UNSET — the shell's defineEnv runs at module evaluation on
          # a dynamic route, not during static generation, so a missing client id
          # surfaces as a 500 on /login at RUNTIME, not as a red build. CI is
          # therefore not covering this, and setting them here does not make it
          # cover it. Treat a green build as saying nothing about runtime env.
          NEXT_PUBLIC_ZITADEL_CLIENT_ID: ci-build-client-id
          NEXT_PUBLIC_ZITADEL_ISSUER_URL: http://auth.tesserix.localhost:20080
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOT because the port control uses it — since #920 that is `ss` on
      # Linux (scripts/lib/repo-owns.sh's port_tool), and iproute2 ships in
      # the runner image. lsof is needed here for two narrower things
      # preflight.test.sh exercises: the NEGATIVE CONTROL in the paren-comm
      # regression test, which asserts raw lsof still cannot see a
      # `next-server (v16.2.12)` listener, and cwd_of's non-Linux fallback.
      # Without it the negative control would silently not run.
      - name: Ensure lsof is present
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - run: make test-scripts
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the gate scans every commit, so a secret added
          # and then removed in a later commit is still caught. With the
          # default shallow clone it would not be.
          fetch-depth: 0
      # The container, NOT gitleaks/gitleaks-action@v2. That action
      # requires a paid GITLEAKS_LICENSE for ORGANISATION-owned repos,
      # and tesserix/hms is private under the tesserix org — so the
      # action would fail on licensing, not on findings. This repo is
      # also on the GitHub Free plan with no org secrets, so a license
      # could not be supplied even if bought. Running the container
      # directly has a second advantage: CI runs the exact command a
      # developer runs locally, so the two cannot drift.
      #
      # Pinned by tag AND digest, not `:latest`. `.gitleaks.toml`'s
      # allowlist relies on gitleaks MERGING our rule into the default
      # ruleset rather than replacing it outright — true on v8.30.1, but
      # that merge-vs-replace behaviour is version-dependent. A `:latest`
      # float that changed it would silently disable the detector: the
      # gate would keep reporting "no leaks found" forever instead of
      # failing loudly. Pinning removes that failure mode; bump
      # deliberately, then re-verify the allowlist still merges.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect \
            --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact
  e2e:
    runs-on: ubuntu-latest
    # 30 minutes, and the number is a fail-closed bound rather than a guess.
    #
    # The floor is MEASURED, not estimated: the first green run of this job
    # took 9m54s end to end (run 32360454402 — 10:45:17 to 10:55:11), of
    # which session-renewal.spec.ts spends ~3.5 minutes deliberately waiting
    # out a short SESSION_TTL. That part is wall-clock the job can never
    # optimise away. The design spec's "roughly 8-10 minutes" estimate is
    # replaced by that figure.
    #
    # The ceiling: `make e2e` has a documented UNBOUNDED hang (#923 —
    # zitadel-login latches a stale PAT and waits forever). With no timeout,
    # that hang burns GitHub's own 6-hour job limit. 30m is a 3x margin over
    # the measured run — room for a cold Docker pull, a slower runner, or a
    # suite that grows — and far below the 66 minutes the design spec set as
    # the outer acceptable bound, so a hang dies in half an hour instead of
    # at hour six.
    #
    # If this ever starts timing out on legitimately slower runs, the fix is
    # to find out WHY the suite got slower — not to raise this number.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # *.localhost DOES resolve on ubuntu-24.04 without this — systemd-resolved
      # synthesizes it (verified live on image 20260810.271.1: `getent hosts
      # helivanta.localhost` answers, exit 0). But it answers ::1, IPv6 ONLY.
      # curl survived that via happy-eyeballs fallback to 127.0.0.1; nothing
      # guarantees the rest of the chain does, and that chain is long — Node
      # scripts, a Go API, four `next dev` servers and Chromium, each with its
      # own address-family behaviour. A service bound to 127.0.0.1 and a client
      # that resolves only ::1 fail as a bare ECONNREFUSED that nobody
      # attributes to address family.
      #
      # This line was verified to pin Node's dns.lookup to IPv4 (family 4). It
      # is one line of redundancy against an opaque, hard-to-diagnose failure.
      - name: Pin the stack's hostnames to IPv4 loopback
        run: echo '127.0.0.1 helivanta.localhost auth.tesserix.localhost' | sudo tee -a /etc/hosts

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          # The `go` job above omits this and its cache silently never
          # hits: setup-go looks for go.sum at the REPO ROOT by default,
          # and this repo's Go module lives under backend/. Not copying
          # that here (fixing the `go` job is out of scope for #920).
          cache-dependency-path: backend/go.sum

      - run: pnpm install --frozen-lockfile

      # scripts/lib/repo-owns.sh resolves port holders with `ss` on Linux —
      # NOT lsof, which cannot see a `next dev` server at all (see port_tool
      # there). scripts/e2e.sh depends on that for every fixture swap, and a
      # missing `ss` would make the swap silently stop nothing. Asserted
      # rather than installed: iproute2 is part of the runner image, and if a
      # future image drops it this must fail loudly here rather than quietly
      # take the broken path ten minutes later.
      - name: Assert ss is present
        run: command -v ss

      # Browser binaries only, keyed on the resolved @playwright/test version
      # in the lockfile. Safe to cache because it is versioned content that
      # cannot go stale independently of the key: a Playwright bump changes
      # pnpm-lock.yaml, which changes the key, which misses. Deliberately NOT
      # caching anything the stack's own state depends on — no Docker volumes,
      # no dev/zitadel/secrets, no seeded database. Zitadel writes its instance
      # domain once at first provisioning, so a restored volume would be exactly
      # the stale-instance failure scripts/preflight.sh exists to catch.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Runs unconditionally even on a cache hit: --with-deps also installs the
      # apt libraries Chromium needs, which live outside the cached path.
      - run: pnpm --filter e2e exec playwright install --with-deps chromium

      # The prerequisite chain, via the SAME make targets a developer runs.
      # dev-infra is preflight -> compose up (postgres/nats/redis/openfga, then
      # the four zitadel services) -> healthz poll -> the stale-instance
      # preflight check -> scripts/zitadel-bootstrap.mjs. `seed` depends on
      # `migrate`. Reimplementing any of it inline would create a CI-only copy
      # that drifts from the developer path without anyone noticing.
      #
      # No secrets, and none are possible: every credential here is either a
      # committed literal (HELIVANTA_DEV_ZITADEL_MASTERKEY, the compose
      # postgres/redis passwords, HELIVANTA_DEV_SESSION_SIGNING_KEY — all only
      # usable because HELIVANTA_ENV=dev is required alongside them) or is
      # generated locally at first boot (login-client.pat by Zitadel's own
      # first-instance provisioning, the client ids by zitadel-bootstrap.mjs).
      # If a step here ever appears to need a GitHub secret, that means a real
      # credential leaked into the dev path — fix that, do not add the secret.
      - name: Bring up dev infra
        run: make dev-infra
      - name: Migrate and seed
        run: make seed

      # `make up`'s own final line, verbatim, backgrounded. up itself is
      # dev-infra + seed (both already run above, in the foreground where their
      # failures are legible) followed by exactly this. Running `make up` here
      # instead would put the whole chain behind one background process, so a
      # bootstrap failure would surface only as the wait below timing out.
      - name: Start API and zone apps
        run: nohup make -j2 dev-api dev-web > /tmp/hms-stack.log 2>&1 &

      # scripts/e2e.sh REQUIRES the stack to already answer — it fails fast
      # rather than waiting, because a developer running `make e2e` has
      # already run `make dev`. CI has no such human step, so the wait lives
      # here. Polling, not sleeping: `go run ./cmd/api` compiles first and
      # `next dev` compiles a route on first request, and both are much
      # slower on a cold runner than on a warm laptop.
      #
      # No `|| true` and no fallback: if the stack never comes up, this step
      # fails and the run is red.
      - name: Wait for the stack
        # Wall clock for the whole step, on top of the per-URL deadline
        # below: five URLs at 300s each would be 25 minutes, which is most of
        # the job budget. Ten minutes is far more than the ~90s this takes in
        # practice and still leaves the e2e step its own 20.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # A DEADLINE, not an iteration count. The loop below is `curl` plus
          # `sleep 1`, and against a server that accepts and then stalls —
          # exactly the `next dev` first-request compile this step exists to
          # pay for — each iteration costs the full curl timeout. Counting
          # iterations would make "300s" mean up to 55 minutes, and the
          # timeout message would name a number that never elapsed.
          wait_for() {
            local url=$1 label=$2 deadline=$((SECONDS + 300))
            printf 'Waiting for %s (%s)…' "$label" "$url"
            # No -f: a 404 or a 3xx still proves the server answered. Only
            # "could not connect" counts as not ready — same rule
            # scripts/e2e.sh's own wait_for_port applies.
            #
            # --max-time 10, not e2e.sh's 2: this is the request that PAYS
            # for the first-request compile, so it has to be willing to wait
            # for it rather than abandon it every second.
            until curl -sS --max-time 10 "$url" >/dev/null 2>&1; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo
                echo "Timed out after 300s waiting for $label at $url." >&2
                exit 1
              fi
              printf '.'
              sleep 1
            done
            echo ' ready.'
          }
          wait_for http://localhost:8080/healthz "API"
          # The EXACT URLs scripts/e2e.sh's own require_port_up probes, not
          # just the ports. `next dev` compiles a route on FIRST REQUEST, and
          # e2e.sh allows 2 seconds — so a shell that answers "/" instantly
          # can still miss that budget on "/login", which is what failed here
          # before this line existed (run 32357162146: ":4301 is not
          # answering at .../login"). Requesting it here pays the compile
          # once, in a step whose whole job is to wait.
          wait_for "http://helivanta.localhost:4301/login" "shell /login"
          for port in 4302 4303 4304; do
            wait_for "http://helivanta.localhost:$port/" "zone app on :$port"
          done

      - name: make e2e
        # STEP-level, so a #923 hang is attributed to THIS step rather than
        # to the job. A job-level timeout cancels the job, and while the dumps
        # below survive that (see their own comment), the run then reads as a
        # bare "exceeded the maximum execution time" with no step named. A
        # step timeout fails the step instead: the job stays alive, finishes
        # normally, and the failure points at `make e2e`. The job-level 30
        # stays as the backstop for a hang anywhere outside this step.
        #
        # 20 minutes against a measured 4m30s for this step inside a 9m54s
        # job — a 4x margin, and still inside the job budget with room for
        # the dumps to finish.
        timeout-minutes: 20
        run: make e2e

      # A hang (#923) otherwise reads as a bare "the job running exceeded the
      # maximum execution time" with nothing naming a cause. These dumps are
      # what distinguish "zitadel-login is wedged on a stale PAT" from "a
      # spec genuinely failed".
      #
      # The condition is `!success() || cancelled()`, and the mechanism is
      # worth stating correctly because the obvious guess is wrong.
      #
      # GitHub does not scan the `if` text for `cancelled()`. It EVALUATES the
      # expression with the job status set to Cancelled — under which
      # `success()`, `failure()` and `!cancelled()` are all false, which is
      # why steps written that way skip. The only textual special case runs
      # the other way: an `if` containing no status-check function gets
      # `success() &&` implicitly prepended.
      #
      # So `!success()` ALONE is already true under cancellation, and is what
      # actually does the work here — on a step failure and on a job
      # cancellation alike. `|| cancelled()` is logically redundant; it is
      # kept only because it says out loud that this step is meant to survive
      # a cancelled job. Neither clause fires on a green run, so a passing
      # build does not dump Zitadel's logs at anyone.
      #
      # Consequence worth recording: a hang in `dev-infra` or `seed` — steps
      # with no timeout of their own — hits the JOB bound, cancels the job,
      # and these dumps STILL run, inside the default 5-minute cancel-timeout
      # (they take about a second). The step-level `timeout-minutes` on
      # `make e2e` above buys a better headline, not the diagnostics
      # themselves. Step timeouts on the earlier steps would be a
      # nice-to-have, not a correctness fix.
      #
      # These run `docker compose` directly rather than through make, so the
      # HELIVANTA_* variables make exports are unset and compose warns about a
      # blank masterkey. Harmless here: `ps` and `logs` read container state,
      # they do not (re)create anything from the substituted value.
      - name: Dump container state on failure
        if: ${{ !success() || cancelled() }}
        run: docker compose -f docker-compose.dev.yml ps
      # zitadel-login is the container #923 hangs in — but it can only hang
      # once it exists, and it does not exist until zitadel itself has
      # provisioned. So core's log is dumped alongside it: a crash-loop there
      # is otherwise reported only as "zitadel-pat-ready didn't complete".
      # Full logs, not a --tail slice: `restart: unless-stopped` means a
      # container that fails at boot fails repeatedly, and every repeat is a
      # consequence of the FIRST one. A tail shows only the consequences.
      - name: Dump Zitadel logs on failure
        if: ${{ !success() || cancelled() }}
        run: docker compose -f docker-compose.dev.yml logs zitadel zitadel-login zitadel-pat-ready
      # An explicit branch, not `|| true`: a failure before the stack ever
      # started leaves no log, and that is information, not an error to
      # swallow. Suppressing the exit code would also suppress a genuine
      # read failure on a log that DOES exist.
      - name: Dump API and web logs on failure
        if: ${{ !success() || cancelled() }}
        run: |
          if [ -f /tmp/hms-stack.log ]; then
            cat /tmp/hms-stack.log
          else
            echo '/tmp/hms-stack.log does not exist — the run failed before the API and zone apps were started.'
          fi

      # playwright-report/ holds the HTML report; test-results/ holds the
      # traces retained for failed tests (e2e/playwright.config.ts). Both are
      # written per playwright invocation and scripts/e2e.sh stops at the first
      # failing phase, so what lands here is the failing phase's evidence.
      - name: Upload Playwright report and traces
        if: ${{ !success() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
