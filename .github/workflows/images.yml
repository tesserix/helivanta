name: Images - Build, Scan, Sign, Publish

# Deliberately NOT path-filtered, unlike the fleet's mature pattern
# (homechef-api-build.yml). HomeChef path-filters its builds and therefore
# needs a separate `homechef-ensure-image-tags` workflow to carry unchanged
# images forward before advancing its `deploy` branch. That workflow's own
# header documents three ways it has wedged production: a GAR pull-through
# mirror caching a tag->digest mapping for an image that was then
# re-pointed, a `cancel-in-progress: false` concurrency deadlock that
# silently stopped advancing `deploy` with nothing failing to say so, and
# negative-cached 404s for not-yet-pushed tags.
#
# Helivanta builds every image on every `main` commit instead - no path
# filters, no carry-forward workflow. That deletes the failure class rather
# than managing it, and it is affordable because ADR-0001 states one PR
# spans frontend and backend, so most commits would rebuild both anyway.
on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  REGISTRY: ghcr.io
  # Workflow-level IMAGE_NAME predates the second image and is consumed
  # unqualified throughout build-helivanta-api. build-helivanta-shell
  # redeclares IMAGE_NAME in its own job-level `env:`, which shadows this
  # for that job only. Chosen over renaming this to IMAGE_NAME_API: a
  # rename would touch ten `${{ env.IMAGE_NAME }}` references inside a job
  # that has already published a real signed image, purely for symmetry.
  # Job-level env is the documented GitHub precedence rule (job overrides
  # workflow), not a trick, and it keeps the proven job byte-identical.
  IMAGE_NAME: tesserix/helivanta/helivanta-api

jobs:
  # SCOPE NOTE (#824 slice 1b): two images are built here, helivanta-api and
  # helivanta-shell, as two independent sibling jobs. The shell was blocked
  # until #888 - NEXT_PUBLIC_ZITADEL_CLIENT_ID had to be minted by
  # provisioning a Zitadel app on production, and Next inlines it at build
  # time, so Dockerfile.shell could not exist until it was. That prerequisite
  # is met; the client id is now a literal in build-helivanta-shell below.
  #
  # The duplication between the two jobs is deliberate and should stay.
  # build-helivanta-api has published a real signed image to GHCR, so it is
  # proven end to end; folding both into a `strategy.matrix` would rewrite
  # every step of a working job to save roughly forty lines, and the two
  # images are not actually symmetric anyway (the shell needs six build-args
  # and a different base image, the api needs none). A third image should be
  # a third sibling job, not the trigger for a matrix refactor.
  build-helivanta-api:
    name: Build and Push helivanta-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No `:latest` - charts/apps/console/values.yaml in tesserix-k8s
          # pins an explicit tag, and floating `:latest` is the anti-pattern
          # HomeChef's own workflow comment forbids: what runs is then not
          # what any tag names.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            # The FULL 40-char sha, additionally (#824 Task 8). Kargo's prod
            # Stage derives image.tag from `commitFrom(...).ID`, which is the
            # whole commit id — so an image must be reachable under exactly
            # that string. The `main-<sha7>` tag above stays: it is what the
            # charts pin today and what a human reads in a rollout. This adds
            # a second name for the same digest rather than renaming anything.
            #
            # The alternative was truncating the id inside a Kargo expression
            # to rebuild `main-<sha7>`. Rejected: it puts a string operation
            # between "the commit Kargo promoted" and "the image that runs",
            # and a mismatch there surfaces as an ImagePullBackOff with no
            # indication which of the two is wrong.
            #
            # `prefix=` (EMPTY) is load-bearing. docker/metadata-action's
            # `type=sha` defaults to `prefix=sha-`, so this line published
            # `sha-<40>` on its first real run while the Kargo Stage writes
            # the BARE id from `commitFrom(...).ID`. The tag the Stage names
            # would not have existed, the pod would have pulled a 404, and the
            # GAR pull-through mirror would have negative-cached it into an
            # ImagePullBackOff that does not recover — the exact failure this
            # tag was added to avoid. Caught by reading the published tag list
            # rather than trusting the action's default.
            type=sha,format=long,prefix=,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=helivanta-api
            org.opencontainers.image.description=Helivanta backend API service

      - name: Compute cache ref
        id: cache
        run: echo "ref=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # On a PR nothing is pushed; load the image locally so Trivy can
          # scan it (catches base-image CVEs before merge, not only after).
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          tags: ${{ github.event_name == 'pull_request' && 'local/helivanta-api:pr-scan' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          # cache write needs GHCR auth (skipped on PRs); read-only cache-from still works
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.cache.outputs.ref) || '' }}

      # --- Security scanning (gated: fails the build on fixable CRITICAL/HIGH) ---
      # On a PR: scan the locally-loaded image and fail the check on a fixable
      # CRITICAL/HIGH, so a vulnerable base image or dependency is caught before
      # merge. Table output goes to the Actions log (the Security tab is
      # per-default-branch, so SARIF upload stays push-only below).
      - name: Run Trivy vulnerability scanner (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/helivanta-api:pr-scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner
        id: trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      # --- SBOM (pushes only) ---
      - name: Generate SBOM with Syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}
          format: spdx-json
          output-file: helivanta-api-sbom.spdx.json
          upload-artifact: true

      # --- Cosign keyless signing (pushes only) ---
      #
      # NOTHING VERIFIES THIS YET. The production cluster
      # (gke_tesseracthub-480811_asia-south1_tesseract-prod-in-gke) runs
      # three TIG governance ClusterPolicies and no `verifyImages` policy,
      # and `grep -rli cosign` across tesserix-k8s returns nothing -
      # helivanta-api is the fleet's first signed image. No admission
      # controller checks this signature before a pod using this image is
      # scheduled. Do not infer that signing implies enforcement.
      #
      # Signed anyway because of asymmetry, not rigour: a signature binds to
      # a digest, so an image promoted unsigned cannot be signed
      # retroactively - it must be rebuilt, and a rebuilt digest is a
      # different artifact than the one that was tested. Signing now keeps
      # the option open for a future `verifyImages` policy without having to
      # go back and re-sign everything already shipped.
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Application:** helivanta-api" >> "$GITHUB_STEP_SUMMARY"
          echo "**Architecture:** AMD64" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "**Docker Image:** Pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Docker Image:** Built successfully (not pushed)" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-helivanta-shell:
    name: Build and Push helivanta-shell
    runs-on: ubuntu-latest

    env:
      # Shadows the workflow-level IMAGE_NAME for this job only - see the
      # comment on that block above for why the api job keeps the bare name.
      IMAGE_NAME: tesserix/helivanta/helivanta-shell

      # --- Build-time configuration, baked irreversibly into the image ---
      #
      # These six values are the same defaults as the `image-shell` Makefile
      # target, and they MUST stay in step with it: Dockerfile.shell declares
      # every one of them as an ARG with no default, precisely so an unset
      # value fails the build instead of silently baking next.config.ts's
      # localhost fallbacks. A workflow that omitted one would not go red -
      # it would publish an image whose rewrite table points at the pod's own
      # loopback.
      #
      # NEXT_PUBLIC_ZITADEL_CLIENT_ID IS NOT A SECRET, and must not be moved
      # into `secrets`. It is a public OIDC client identifier: Next inlines
      # it into the client bundle, and it is visible in the query string of
      # every authorize redirect in the user's address bar. Two concrete
      # reasons it belongs here as a literal:
      #   1. This repo is on the GitHub Free plan with no org secrets. An
      #      undefined `secrets.*` reference resolves to the EMPTY STRING,
      #      not an error - the same trap ci.yml's `web` job documents for
      #      PKG_READ_TOKEN. An empty client id would produce a green build
      #      and an image that cannot complete OIDC.
      #   2. Even a correctly-populated secret would be pointless: the value
      #      is compiled into a public artifact seconds later.
      SHELL_ZITADEL_ISSUER_URL: https://auth.tesserix.app
      SHELL_ZITADEL_CLIENT_ID: '386782591925092979'
      SHELL_API_URL: http://helivanta-api.helivanta.svc.cluster.local:8080
      # The zone apps are not deployed until slice 2. These are the
      # in-cluster Service DNS names they WILL have. Until then /medicore,
      # /pharmacy and /lab 502 on an unresolvable host - deliberately chosen
      # over localhost, which would proxy those paths back to the shell
      # itself and look like it worked. See Dockerfile.shell.
      SHELL_MEDICORE_URL: http://helivanta-medicore.helivanta.svc.cluster.local:4302
      SHELL_PHARMACY_URL: http://helivanta-pharmacy.helivanta.svc.cluster.local:4303
      SHELL_LAB_URL: http://helivanta-lab.helivanta.svc.cluster.local:4304

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # No `:latest` - same reasoning as the api job: charts in
          # tesserix-k8s pin an explicit tag, and a floating `:latest` means
          # what runs is not what any tag names.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            # The FULL 40-char sha, additionally (#824 Task 8). Kargo's prod
            # Stage derives image.tag from `commitFrom(...).ID`, which is the
            # whole commit id — so an image must be reachable under exactly
            # that string. The `main-<sha7>` tag above stays: it is what the
            # charts pin today and what a human reads in a rollout. This adds
            # a second name for the same digest rather than renaming anything.
            #
            # The alternative was truncating the id inside a Kargo expression
            # to rebuild `main-<sha7>`. Rejected: it puts a string operation
            # between "the commit Kargo promoted" and "the image that runs",
            # and a mismatch there surfaces as an ImagePullBackOff with no
            # indication which of the two is wrong.
            #
            # `prefix=` (EMPTY) is load-bearing. docker/metadata-action's
            # `type=sha` defaults to `prefix=sha-`, so this line published
            # `sha-<40>` on its first real run while the Kargo Stage writes
            # the BARE id from `commitFrom(...).ID`. The tag the Stage names
            # would not have existed, the pod would have pulled a 404, and the
            # GAR pull-through mirror would have negative-cached it into an
            # ImagePullBackOff that does not recover — the exact failure this
            # tag was added to avoid. Caught by reading the published tag list
            # rather than trusting the action's default.
            type=sha,format=long,prefix=,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=helivanta-shell
            org.opencontainers.image.description=Helivanta shell frontend (Next.js)

      - name: Compute cache ref
        id: cache
        run: echo "ref=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.shell
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # On a PR nothing is pushed; load the image locally so Trivy can
          # scan it (catches base-image CVEs before merge, not only after).
          load: ${{ github.event_name == 'pull_request' }}
          provenance: false
          tags: ${{ github.event_name == 'pull_request' && 'local/helivanta-shell:pr-scan' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_ZITADEL_ISSUER_URL=${{ env.SHELL_ZITADEL_ISSUER_URL }}
            NEXT_PUBLIC_ZITADEL_CLIENT_ID=${{ env.SHELL_ZITADEL_CLIENT_ID }}
            API_URL=${{ env.SHELL_API_URL }}
            MEDICORE_URL=${{ env.SHELL_MEDICORE_URL }}
            PHARMACY_URL=${{ env.SHELL_PHARMACY_URL }}
            LAB_URL=${{ env.SHELL_LAB_URL }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          # cache write needs GHCR auth (skipped on PRs); read-only cache-from still works
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max', steps.cache.outputs.ref) || '' }}

      # --- Security scanning (gated: fails the build on fixable CRITICAL/HIGH) ---
      - name: Run Trivy vulnerability scanner (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/helivanta-shell:pr-scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Run Trivy vulnerability scanner
        id: trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          # Explicit, because two jobs now upload SARIF for the same commit.
          # upload-sarif does derive a distinct analysis key from the job
          # name on its own, so this is belt-and-braces rather than a fix -
          # but it pins the separation to a name we control instead of to
          # the job name, which someone may rename.
          category: trivy-helivanta-shell
        continue-on-error: true

      # --- SBOM (pushes only) ---
      - name: Generate SBOM with Syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_push.outputs.digest }}
          format: spdx-json
          output-file: helivanta-shell-sbom.spdx.json
          upload-artifact: true

      # --- Cosign keyless signing (pushes only) ---
      # Nothing verifies this yet - see the long note on the api job's
      # signing steps above. Signed for the same reason: a signature binds
      # to a digest, so an image promoted unsigned cannot be signed
      # retroactively without rebuilding it into a different artifact.
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build_push.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Application:** helivanta-shell" >> "$GITHUB_STEP_SUMMARY"
          echo "**Architecture:** AMD64" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Baked build args (build-time, not overridable by the pod):**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_ZITADEL_ISSUER_URL=${{ env.SHELL_ZITADEL_ISSUER_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_PUBLIC_ZITADEL_CLIENT_ID=${{ env.SHELL_ZITADEL_CLIENT_ID }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API_URL=${{ env.SHELL_API_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "MEDICORE_URL=${{ env.SHELL_MEDICORE_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "PHARMACY_URL=${{ env.SHELL_PHARMACY_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "LAB_URL=${{ env.SHELL_LAB_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "**Docker Image:** Pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Docker Image:** Built successfully (not pushed)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ===========================================================================
  # advance-deploy — the branch Kargo watches (#824 Task 8)
  # ===========================================================================
  #
  # Fast-forwards `deploy` to the commit whose images have just been published.
  # Kargo's Warehouse subscribes to THIS branch, never to `main`.
  #
  # Why not `main`. Kargo would create Freight the moment a commit lands, which
  # is before the images for it exist. The Stage then writes that tag onto the
  # Applications, the pods try to pull it, and the GAR pull-through mirror
  # NEGATIVE-CACHES the resulting 404 — an ImagePullBackOff that does not
  # recover when the image later appears, because the mirror keeps serving the
  # cached miss. Kora's warehouse records this as a real incident, not a
  # theoretical one (tesserix/kora#161), and DevAI hit the neighbouring
  # tag-discovery version of it on 2026-06-09.
  #
  # `needs` both build jobs and the default `success()` condition together are
  # what make the branch mean "every image for this commit is pullable". If
  # either build fails, `deploy` simply does not move: the previous commit stays
  # promotable and production keeps running what it was running. That is the
  # correct direction — a failed build should stall a rollout, never advance one.
  #
  # HomeChef needs a separate `ensure-image-tags` workflow to carry unchanged
  # images forward before advancing its own `deploy`, because it path-filters
  # its builds. This workflow deliberately does not path-filter (see the file
  # header), so every commit rebuilds every image and there is nothing to carry
  # forward — the whole class of "deploy advanced past an image that was never
  # rebuilt" does not exist here.
  advance-deploy:
    name: Advance deploy branch
    runs-on: ubuntu-latest
    needs: [build-helivanta-api, build-helivanta-shell]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward deploy to this commit
        run: |
          set -euo pipefail
          # --force-with-lease is deliberately NOT used, and neither is a plain
          # force. `deploy` is only ever moved by this job, always to a commit
          # that is already an ancestor-or-descendant on main, so a fast-forward
          # push is the honest operation: if it is ever REJECTED, `deploy` has
          # diverged from main by some route nobody intended, and the right
          # answer is a failed job somebody reads — not a force that overwrites
          # whatever that was.
          git push origin "${GITHUB_SHA}:refs/heads/deploy"
          echo "deploy -> ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
