name: Release - Production

# Kargo auto-promotes every new release/prod commit. Only this job can move it: the ruleset
# admits just the deploy key held by the main-only, reviewer-gated `production` environment.
# See docs/deployment/production-release.md.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit already on deploy to release (blank releases the deploy head)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-prod
  cancel-in-progress: false

jobs:
  release:
    name: Advance release/prod
    # A dispatch from another branch would run that branch's copy of the release script.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # Moves each image's release-prod tag, which Kargo's Warehouse follows, to the verified digest.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_PROD_DEPLOY_KEY }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install crane
        env:
          VERSION: 0.22.1
          SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/v${VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${SHA256}  crane.tgz" | sha256sum -c -
          tar -xzf crane.tgz crane
          install -m 0755 crane /usr/local/bin/crane
          rm -f crane crane.tgz

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify images and advance release/prod
        env:
          COMMIT: ${{ inputs.commit }}
        run: bash scripts/release-prod.sh ${COMMIT:+"$COMMIT"}
