name: Supplier workflow regression tests
on:
  pull_request:
    paths:
      - "backend/pkg/supplieraccess/**"
      - "packages/api/src/supplier-access*"
      - "contracts/supplier-access.json"
      - "backend/pkg/suppliertrade/**"
      - "backend/pkg/supplierorder/**"
      - "backend/pkg/supplierfulfilment/**"
      - "backend/internal/supplierstock/**"
      - "contracts/supplier-fulfilment.json"
      - "contracts/supplier-stock-schema.sql.tmpl"
      - "packages/api/src/supplier-fulfilment*"
      - "backend/internal/globalapi/supplier_fulfilment_test.go"
      - "contracts/supplier-orders.json"
      - "packages/api/src/supplier-orders*"
      - "backend/internal/modules/iam/**"
      - "backend/internal/modules/supply/**"
      - "backend/internal/modules/pharmacy/**"
      - "backend/internal/globalapi/supplier_recipient_test.go"
      - "backend/internal/globalapi/supplier_order_http_test.go"
      - "backend/internal/globalapi/workforce_person_review_test.go"
      - ".github/workflows/supplier-workflow.yml"
permissions:
  contents: read
concurrency:
  group: supplier-workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supplier:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Effective supplier grant consent
        run: go test -race ./pkg/supplieraccess
      - name: Supplier order intent and owner protocol
        run: |
          go test -race ./pkg/supplierorder
          go test -race ./internal/modules/supply -run '^TestDirectedRelationshipProtocolPersistsBothConsentsAndNeverReactivatesFromReplay$'
          go test -race ./internal/modules/pharmacy -run '^TestOrderProductFactsKeepPrivateOwnerVersionUnitsAndPurpose$'
          go test -race ./internal/globalapi -run '^TestSupplierOrderHTTPRejectsChangedContextMalformedCommandsAndUnavailableOwners$'
      - name: Fulfilment quantities and receiving evidence
        if: ${{ !cancelled() }}
        run: go test -race ./pkg/supplierfulfilment ./internal/supplierstock
      - name: Real owner stock allocation and original recovery
        if: ${{ !cancelled() }}
        run: go test -race -timeout 35m ./internal/globalapi -run '^TestOwnerAllocationBudgetsSerializeAndRecoverOriginalIntent$'
      - name: Reviewed receiving corrections and custody rollback
        if: ${{ !cancelled() }}
        run: go test -race -timeout 35m ./internal/modules/pharmacy -run '^TestSupplierReceivingCorrectionRepositoryRetainsEvidenceAndRollsBackCustodyFailures$'
      - name: Durable bilateral supplier grant protocol
        run: go test -race ./internal/modules/iam -run '^TestSupplierGrantProtocol'
      - name: Warehouse product identity and independent quality review
        run: go test -race -timeout 35m ./internal/globalapi -run '^TestWholesaleIdentityCheckThroughGlobalAPIUsesCurrentCatalogueOwner$'
      - name: Supplier grant projection isolation
        run: go test -race ./pkg/authz -run '^TestPartnerAssignment'
      - name: Current hospital Staff recipient and membership cutoff
        run: go test -race -timeout 35m ./internal/globalapi -run '^TestPreEmploymentPersonReviewPreservesInactiveJoiner$'
  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supplier grant client context and exact recovery
        run: pnpm --dir packages/api exec vitest run src/supplier-access.test.ts src/supplier-orders.test.ts src/supplier-orders-contract.test.ts
