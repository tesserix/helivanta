name: Supplier workflow regression tests
on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Focused compound admission or the full supplier regression workflow
        type: choice
        required: true
        default: focused
        options: [focused, full]
  pull_request:
    paths:
      - "backend/pkg/supplieraccess/**"
      - "packages/api/src/supplier-access*"
      - "packages/api/src/supplier-partner-shipments*"
      - "contracts/supplier-access.json"
      - "contracts/supplier-trade.json"
      - "backend/pkg/suppliertrade/**"
      - "backend/pkg/supplierorder/**"
      - "backend/pkg/supplierfulfilment/**"
      - "backend/internal/supplierstock/**"
      - "contracts/supplier-fulfilment.json"
      - "contracts/supplier-stock-schema.sql.tmpl"
      - "packages/api/src/supplier-fulfilment*"
      - "contracts/supplier-orders.json"
      - "packages/api/src/supplier-orders*"
      - "backend/internal/modules/iam/**"
      - "backend/internal/modules/workforce/**"
      - "backend/internal/modules/supply/**"
      - "backend/internal/modules/pharmacy/**"
      - "backend/internal/globalapi/supplier_*"
      - "backend/internal/globalapi/trading_policy_fixture_test.go"
      - "backend/internal/testutil/harness.go"
      - "backend/internal/globalapi/pharmacy_trading_scope_test.go"
      - "backend/internal/globalapi/trading_source_peer_test.go"
      - "scripts/supplier-workflow.test.mjs"
      - "backend/internal/globalapi/workforce_person_review_test.go"
      - "backend/internal/globalapi/workforce_posting*"
      - ".github/workflows/supplier-workflow.yml"
permissions:
  contents: read
concurrency:
  group: supplier-workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compound-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Isolate the focused Go build cache
        run: printf 'GOCACHE=%s/helivanta-compound-go-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Verify selected supplier tests and source triggers
        run: node --test ../scripts/supplier-workflow.test.mjs
      - name: Record focused build platform and isolated cache paths
        run: |
          go version
          go env GOOS GOARCH GOCACHE GOMODCACHE
      - name: Build affected test packages with a fresh runner cache
        run: go test -race -run '^$' ./internal/globalapi ./internal/testutil
      - name: Current hospital Staff and effective compound supplier grants
        run: go test -race -v -count=1 -failfast -timeout 35m ./internal/globalapi -run '^TestPreEmploymentPersonReviewPreservesInactiveJoiner$'
  staff-query-plans:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Compare bounded Staff point reads with unchanged tenant isolation
        run: go test -race -v -timeout 5m ./internal/modules/workforce -run '^TestStaffPointReadPlansPreserveTenantIsolation$'
  source-presentations:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify supplier acceptance selectors
        run: node --test ../scripts/supplier-workflow.test.mjs
      - name: Current names retain warehouse and pharmacy owner eligibility
        run: |
          go test -race -timeout 12m ./internal/modules/supply -run '^TestSupplierTradingSource'
          go test -list '^TestPharmacyTradingScopeNeedsCurrentSourceAdministrationAndIndependentEvidence$' ./internal/globalapi | grep -Fx 'TestPharmacyTradingScopeNeedsCurrentSourceAdministrationAndIndependentEvidence'
          go test -race -timeout 12m ./internal/globalapi -run '^TestPharmacyTradingScopeNeedsCurrentSourceAdministrationAndIndependentEvidence$'
  supplier:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Supplier return preparation, dispatch and private recovery
        run: go test -race -v -timeout 35m ./internal/modules/pharmacy -run '^TestSupplierReturn'
      - name: Effective supplier grant consent
        run: go test -race ./pkg/supplieraccess
      - name: Supplier order intent and owner protocol
        run: |
          go test -race ./pkg/supplierorder
          go test -race ./internal/modules/supply -run '^TestDirectedRelationshipProtocolPersistsBothConsentsAndNeverReactivatesFromReplay$'
          go test -race ./internal/modules/pharmacy -run '^TestOrderProductFactsKeepPrivateOwnerVersionUnitsAndPurpose$'
          go test -race ./internal/globalapi -run '^TestSupplierOrderHTTPRejectsChangedContextMalformedCommandsAndUnavailableOwners$'
      - name: Fulfilment quantities and receiving evidence
        if: ${{ !cancelled() }}
        run: go test -race ./pkg/supplierfulfilment ./internal/supplierstock
      - name: Real owner stock allocation and original recovery
        if: ${{ !cancelled() }}
        run: go test -race -timeout 35m ./internal/globalapi -run '^TestOwnerAllocationBudgetsSerializeAndRecoverOriginalIntent$'
      - name: Outlet reorder levels, isolation and available stock
        if: ${{ !cancelled() }}
        run: go test -race -v -timeout 35m ./internal/modules/pharmacy -run '^TestReorder'
      - name: Current Staff source HTTP views and directed response recovery
        if: ${{ !cancelled() }}
        run: go test -race -timeout 35m ./internal/globalapi -run '^TestSourceViewsUseCurrentReviewedStaffAndRetainReconciliation$'
      - name: Financial acquisition scope, evidence and original recovery
        if: ${{ !cancelled() }}
        run: go test -race -timeout 35m ./internal/modules/pharmacy -run '^Test(AcquisitionReceipt|AcquisitionDirectReceipt|PayableSubjectPrecondition|FinancialAcquisitionReceipts)'
      - name: Reviewed receiving corrections and custody rollback
        if: ${{ !cancelled() }}
        run: go test -race -timeout 35m ./internal/modules/pharmacy -run '^TestSupplierReceivingCorrectionRepositoryRetainsEvidenceAndRollsBackCustodyFailures$'
      - name: Durable bilateral supplier grant protocol
        run: go test -race ./internal/modules/iam -run '^TestSupplierGrantProtocol'
      - name: Warehouse product identity and independent quality review
        run: go test -race -timeout 35m ./internal/globalapi -run '^TestWholesaleIdentityCheckThroughGlobalAPIUsesCurrentCatalogueOwner$'
      - name: Supplier grant projection isolation
        run: go test -race ./pkg/authz -run '^TestPartnerAssignment'
  api-client:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Supplier grant client context and exact recovery
        run: pnpm --dir packages/api exec vitest run src/supplier-access.test.ts src/supplier-orders.test.ts src/supplier-orders-contract.test.ts src/supplier-partner-shipments.test.ts
