version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - sqlclosecheck
    - misspell
    - unconvert
    - depguard
  settings:
    misspell:
      ignore-rules:
        - medicore
    depguard:
      rules:
        module-isolation:
          files:
            - "**/internal/modules/**"
          # list-mode: lax keeps this a denylist ("allowed if it doesn't
          # match deny, or the allow entry is more specific than the deny
          # entry that matched"). depguard's default mode, "original",
          # requires every import to ALSO match something in `allow` once
          # `allow` is non-empty — under that mode, adding the contract
          # exception below would deny "context", "errors", every pkg/*
          # import, everything, because none of them match the (one-entry)
          # allow list either. Confirmed by running `make lint-go` against
          # `original` mode during #827: it failed 50 imports across three
          # files that have nothing to do with module isolation.
          list-mode: lax
          deny:
            - pkg: "github.com/tesserix/helivanta/internal/modules"
              desc: "modules must not import other modules — cross-module data flows only via events (spec D3)"
          allow:
            # The ONE exception: a module's contract package is its
            # published event interface — subject constants and payload
            # types, data only. internal/archtest/contract_test.go
            # enforces that it stays data only; without that test this
            # allowance would be a hole in module isolation rather than a
            # narrow exception to it (#827). Under list-mode: lax, this
            # entry only matters because it is more specific (longer) than
            # the deny entry above — that's what lets it carve out the
            # exception instead of widening it into an allowlist.
            - "github.com/tesserix/helivanta/internal/modules/medicore/contract"
            - "github.com/tesserix/helivanta/internal/modules/pharmacy/contract"
            - "github.com/tesserix/helivanta/internal/modules/lab/contract"
            - "github.com/tesserix/helivanta/internal/modules/iam/contract"
            - "github.com/tesserix/helivanta/internal/modules/reference/contract"
            # loginclient is NOT another module's internals — it lives
            # under internal/modules/iam/ and is iam's own Zitadel
            # login-client wrapper (#854 Task 2/4), consumed by iam's own
            # HTTP handlers (loginui.go). The deny rule above matches on
            # the "internal/modules" PREFIX, so it cannot distinguish "a
            # different module" from "a subpackage of this same module" —
            # without this entry, iam could not import its own
            # subpackage at all. Task 3/4's tests reach it the same way
            # (an external `iam_test`/`iam` package importing
            # iam/loginclient), which the (unrelated) self-import nolint
            # in login_test.go already covers for iam importing iam;
            # this entry is what makes iam importing iam/loginclient
            # possible in non-test code too.
            #
            # This entry reads WIDER than it actually permits: depguard
            # cannot express "only iam may import iam/loginclient", so on
            # its own this would also admit, say, pharmacy importing
            # iam/loginclient — a real cross-module import, exactly what
            # module-isolation exists to block. The compensating control
            # is internal/archtest.TestModulesDoNotImportEachOther, which
            # walks the real dependency graph module-by-module (not by
            # path prefix) and fails on any module importing another
            # module's non-contract package, loginclient included. This
            # allow-list entry only has to be narrow enough to compile;
            # TestModulesDoNotImportEachOther is what keeps it narrow
            # enough to be correct.
            - "github.com/tesserix/helivanta/internal/modules/iam/loginclient"
        no-logrus:
          deny:
            - pkg: "github.com/sirupsen/logrus"
              desc: "slog only (spec D6)"
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

# #919: formatting is part of the Go gate. golangci-lint v2 runs formatters
# as a separate section, and `golangci-lint run` — what `make lint-go` and the
# CI golangci-lint step both execute — reports any file a formatter would
# change, so "0 issues" now also means "gofmt-clean". gofmt, not gofumpt: it
# is the toolchain's own formatter, the style every file here was written to,
# and enabling it restyles nothing; gofumpt's stricter rules would reformat
# code across the tree for no correctness gain.
formatters:
  enable:
    - gofmt

# golangci-lint shows at most 3 issues with the same text by default. Every
# unformatted file has the same text ("File is not properly formatted"), so
# the cap would list only three of them; 0 lists every one, so a run names
# all the files to fix rather than the first three.
issues:
  max-same-issues: 0

run:
  timeout: 5m
