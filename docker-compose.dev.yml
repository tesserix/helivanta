name: hms-dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms
      POSTGRES_DB: hms
    ports: ["5432:5432"]
    volumes:
      - ./dev/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms -d hms"]
      interval: 2s
      timeout: 2s
      retries: 30

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [natsdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "echo 'PING' | nc localhost 4222 | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  openfga:
    image: openfga/openfga:v1.8.4
    restart: unless-stopped
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
    ports: ["8090:8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 2s
      timeout: 2s
      retries: 30

  firebase-auth:
    image: node:22-alpine
    working_dir: /workspace
    # firebase-tools is pinned exactly. `firebase-tools@13` resolved a
    # floating minor on every container start, so two machines could run
    # different emulator builds and every start needed the network —
    # directly against #714's "seeded data identical across machines".
    # The npm cache volume makes restarts fast and offline-capable.
    command: sh -c "npx -y firebase-tools@13.35.1 emulators:start --only auth --project demo-hms"
    restart: unless-stopped
    volumes:
      - ./dev/firebase:/workspace
      - npmcache:/root/.npm
    ports: ["9099:9099"]

volumes:
  pgdata:
  natsdata:
  npmcache:
