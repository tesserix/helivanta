name: helivanta-dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helivanta
      POSTGRES_PASSWORD: helivanta
      POSTGRES_DB: helivanta
    ports: ["${HELIVANTA_PG_PORT:-5432}:5432"]
    volumes:
      - ./dev/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helivanta -d helivanta"]
      interval: 2s
      timeout: 2s
      retries: 30

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    ports: ["${HELIVANTA_NATS_PORT:-4222}:4222", "${HELIVANTA_NATS_MONITOR_PORT:-8222}:8222"]
    volumes: [natsdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "echo 'PING' | nc localhost 4222 | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["${HELIVANTA_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  openfga:
    image: openfga/openfga:v1.8.4
    restart: unless-stopped
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: memory
    # Host side only — the healthcheck below talks to the container's own
    # 8080/8081, which never change.
    ports: ["${HELIVANTA_OPENFGA_PORT:-8090}:8080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Zitadel replaces the Firebase/GIP emulator (#838). Own Postgres — v4
  # requires Postgres 17, CockroachDB support was dropped
  # (docs/superpowers/spikes/2026-08-15-zitadel-spike.md's v4.15.3
  # re-verification) — and its own port range, shifted from both helivanta-dev's
  # other services and the now-deleted spike/zitadel-838/ stack.
  zitadel-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    ports: ["${HELIVANTA_ZITADEL_PG_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - zitadeldata:/var/lib/postgresql/data

  # `start-from-init` provisions the whole Helivanta topology declaratively on
  # first boot, with NO interactive/browser step at all — verified
  # end-to-end for #838 Task 6 (the spike's "still NOT VERIFIED" first-PAT
  # gap is closed): FirstInstance.Org.Machine creates helivanta-seed-bot with
  # IAM_OWNER and writes its PAT to PatPath; FirstInstance.Org.LoginClient
  # does the same for the zitadel-login service below with the
  # instance-level IAM_LOGIN_CLIENT role, via LoginClientPatPath. Both PAT
  # files land in ./dev/zitadel/secrets (git-ignored) via the bind mount,
  # where scripts/zitadel-bootstrap.mjs and scripts/seed-dev.mjs read them
  # from the host. Re-running `docker compose up` after the volumes already
  # exist is a no-op for this provisioning — FirstInstance only runs once.
  #
  # HELIVANTA_DEV_ZITADEL_MASTERKEY must be EXACTLY 32 bytes — Zitadel does not
  # fail fast on a wrong-length key, it crash-loops with "masterkey must be
  # 32 bytes, but is N" on every restart attempt, which reads as a flaky
  # container rather than a one-line config mistake (reproduced live during
  # the v4.15.3 spike re-verification). scripts/preflight.sh checks the
  # length before Docker is ever touched so this is caught in one place,
  # not rediscovered per developer.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.15.3
    restart: unless-stopped
    command: >
      start-from-init
      --masterkey "${HELIVANTA_DEV_ZITADEL_MASTERKEY}"
      --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "${HELIVANTA_ZITADEL_PORT:-20080}"
      # Matches production's split-login topology (tenancy topology design
      # doc, D5a) rather than the simpler core-only "/ui/login" mode: dev
      # exercises the same split-service SHAPE production runs, so the day
      # the frontend task points a real login page at this stack, it is
      # validating the right topology. The org's actual branded
      # tesserix/third-party/zitadel-login:v4.15.3-aurora.1 build is NOT
      # used here (private registry, not requested) — this runs stock
      # ghcr.io/zitadel/zitadel-login, so selector/branding parity with
      # production's aurora build is still unverified; only the split
      # topology itself (core + separate login service + reverse proxy) is
      # proven by this stack.
      #
      # Deliberately "false", not "true" (#854 Task 1). `required=true` is
      # the instance-wide migration forcing-switch: it makes EVERY app on
      # the instance use Login V2 at Zitadel's own /ui/v2/login URL and
      # silently overrides any per-app `loginVersion.loginV2.baseUri`
      # (confirmed live against this exact stack — the PUT returns 200 and
      # reads back correctly, but the redirect never moves while
      # required=true; this is a known, currently-open upstream bug,
      # zitadel/zitadel#10722, not a config mistake on our side). `false`
      # does NOT turn Login V2 off — it just stops forcing the instance
      # default on every app, so each app's own `loginVersion` setting
      # decides. That per-app choice is exactly what keeps the helivanta-web
      # redirect change (scripts/lib/zitadel.mjs's setLoginV2BaseUri) from
      # moving login for any other Tesserix product on the shared instance.
      # PRODUCTION NOTE: this same flip is required there too, and it is
      # NOT a no-op — any other product currently getting Login V2
      # implicitly from the instance-wide flag would fall back to ITS OWN
      # per-app setting (or Login V1, if it has none configured) the moment
      # `required` goes to false. That is a cross-product change and
      # belongs to the platform team, not this task.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Helivanta
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin@helivanta.localhost
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: HmsDevAdminPassw0rd!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: helivanta-seed-bot
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Helivanta Seed Bot
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /secrets/helivanta-seed.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: helivanta-login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Helivanta Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /secrets/login-client.pat
    expose: ["8080"]
    volumes:
      - ./dev/zitadel/secrets:/secrets
    depends_on:
      zitadel-db:
        condition: service_healthy
    healthcheck:
      # NOT reliable — `/app/zitadel ready` reports "not ready" against a
      # v4.15.3 instance even while it demonstrably serves real traffic
      # (spike, v4.15.3 re-verification section). Left in place for
      # `docker compose ps` visibility but nothing depends on it reporting
      # healthy; Makefile's dev-infra polls /debug/healthz from the host
      # instead, and zitadel-login/zitadel-proxy below key off
      # service_started, not service_healthy.
      test: ["CMD", "/app/zitadel", "ready", "--config", "/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Stock upstream login UI — see the zitadel service's LOGINV2_REQUIRED
  # comment above for why dev runs the split topology at all, and what is
  # and is not proven by using the stock image here.
  # Gate between core and zitadel-login. Zitadel writes the login client's
  # PAT during FIRST-INSTANCE PROVISIONING, which happens well after its
  # container starts — and zitadel-login reads that file exactly ONCE, at
  # boot, caching the token for the life of the process. A login container
  # that starts before the file is written therefore holds an invalid token
  # forever: every login 500s with `Errors.Token.Invalid (AUTH-7fs1e)` and
  # its readiness probe fails permanently, while core sits there perfectly
  # healthy. Nothing self-heals, because `restart: unless-stopped` does not
  # restart a merely-unhealthy container.
  #
  # `depends_on: zitadel: service_started` does NOT cover this — the
  # container is up long before provisioning finishes. Reproduced on a
  # genuinely fresh volume: core and login started 76ms apart, login cached
  # an absent PAT, and a fresh clone's first `make up` produced a login
  # nobody could use. Restarting login alone fixed it, which is what
  # identified the cause.
  #
  # #854 Task 5: the SAME file (and the SAME ordering trap) also gates
  # Helivanta's own API process, which reads it into ZITADEL_LOGIN_CLIENT_TOKEN
  # to drive Zitadel's login-client API directly
  # (internal/modules/iam/loginui.go). The API is not a compose service —
  # it runs via `go run ./cmd/api` from the Makefile's dev-api target, not
  # docker-compose — so it cannot depend on this service the way
  # zitadel-login below does; Makefile's dev-api target carries its own
  # equivalent guard instead (a fail-closed "does the PAT file exist and
  # is it non-empty" check, run before `go run` ever starts, mirroring
  # this service's own polling loop), and dev-api only runs after
  # `dev-infra` has waited on Zitadel's healthz, by which point
  # provisioning has completed.
  zitadel-pat-ready:
    image: alpine:3.20
    volumes:
      - ./dev/zitadel/secrets:/secrets:ro
    command: >
      sh -c 'i=0;
      until [ -s /secrets/login-client.pat ]; do
        i=$$((i+1));
        if [ $$i -gt 180 ]; then
          echo "login-client.pat was never written by Zitadel first-instance provisioning" >&2;
          exit 1;
        fi;
        sleep 1;
      done;
      echo "login client PAT is present"'
    depends_on:
      zitadel:
        condition: service_started

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.15.3
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /secrets/login-client.pat
      # zitadel-login's calls to core must present a Host header matching
      # ZITADEL_EXTERNALDOMAIN/PORT above, or core's instance-resolution
      # middleware answers "Instance not found" — reproduced directly
      # while wiring this up: the internal docker-network hostname
      # (zitadel:8080) does not, and cannot, match localhost:20080 on its
      # own. This is the same header override the official Zitadel compose
      # uses (deploy/compose/docker-compose.yml's CUSTOM_REQUEST_HEADERS).
      CUSTOM_REQUEST_HEADERS: "Host:localhost:${HELIVANTA_ZITADEL_PORT:-20080},X-Forwarded-Proto:http"
    volumes:
      - ./dev/zitadel/secrets:/secrets:ro
    depends_on:
      zitadel:
        condition: service_started
      zitadel-pat-ready:
        condition: service_completed_successfully

  # Merges zitadel (everything except /ui/v2/login/*) and zitadel-login
  # (/ui/v2/login/*) under one origin — see dev/zitadel/Caddyfile's own
  # comment for why this is mandatory, not cosmetic. Still required with
  # LOGINV2_REQUIRED=false (#854 Task 1): helivanta-web's per-app
  # loginVersion.loginV2.baseUri sends the browser to Helivanta directly for the
  # primary flow, but spec D3's fallback path still lands on Zitadel's own
  # /ui/v2/login/login?authRequest=… (verified live: it 307s), and the
  # Management Console app has no per-app override, so it still needs
  # /ui/v2/login/* served through this origin.
  zitadel-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["${HELIVANTA_ZITADEL_PORT:-20080}:8080"]
    volumes:
      - ./dev/zitadel/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      zitadel:
        condition: service_started

volumes:
  pgdata:
  natsdata:
  npmcache:
  zitadeldata:
