<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<title>One tenant can own many hospitals.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758d"/></marker></defs>
<rect width="1600" height="1080" fill="#ffffff"/>
<rect x="0" y="0" width="1600" height="12" fill="#163c60"/>
<text x="60" y="65" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#163c60">One tenant can own many hospitals.</text>
<text x="60" y="108" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#627186">ISOLATE BY DEFAULT  /  Share identity, clinical data and CRM only under separate explicit policies</text>
<rect x="60" y="150" width="1070" height="650" rx="18" fill="#f8fafc" stroke="#d0d9e4" stroke-width="2"/>
<text x="84" y="184" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#52657d">TENANT G  ·  Customer / hospital group</text>
<rect x="1180" y="150" width="360" height="650" rx="18" fill="#f8fafc" stroke="#d0d9e4" stroke-width="2"/>
<text x="1204" y="184" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#52657d">TENANT H  ·  Separate customer</text>
<path d="M 240 480 L 240 520 L 595 520 L 595 480" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="303.3" y="495.0" width="228.4" height="22" rx="4" fill="#ffffff"/>
<text x="417.5" y="511.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52657d">A → B: selected records only</text>
<path d="M 145 480 L 145 610" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 685 480 L 685 610" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 950 480 L 950 610" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1360 480 L 1360 610" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="90" y="215" width="1010" height="95" rx="14" fill="#f3edff" stroke="#8663bc" stroke-width="2"/>
<text x="110" y="248" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Zitadel customer organization G</text>
<text x="110" y="276" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Authentication + federation; Helivanta owns hospital memberships and sharing</text>
<rect x="1210" y="215" width="300" height="95" rx="14" fill="#f3edff" stroke="#8663bc" stroke-width="2"/>
<text x="1230" y="248" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">Zitadel organization H</text>
<text x="1230" y="276" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Separate tenant mapping</text>
<text x="1230" y="299" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">No inherited group access</text>
<rect x="90" y="365" width="300" height="115" rx="14" fill="#edf4ff" stroke="#4975b5" stroke-width="2"/>
<text x="110" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">Hospital A</text>
<text x="110" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Local staff • facilities • MRN</text>
<text x="110" y="449" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Clinical records + CRM contacts</text>
<rect x="445" y="365" width="300" height="115" rx="14" fill="#edf4ff" stroke="#4975b5" stroke-width="2"/>
<text x="465" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">Hospital B</text>
<text x="465" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Local staff • facilities • MRN</text>
<text x="465" y="449" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Clinical records + CRM contacts</text>
<rect x="800" y="365" width="300" height="115" rx="14" fill="#f0f3f7" stroke="#8d9aad" stroke-width="2"/>
<text x="820" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">Hospital C</text>
<text x="820" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Local staff • facilities • MRN</text>
<text x="820" y="449" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">ISOLATED from A and B</text>
<rect x="1210" y="365" width="300" height="115" rx="14" fill="#f0f3f7" stroke="#8d9aad" stroke-width="2"/>
<text x="1230" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">Hospital D</text>
<text x="1230" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Own staff, records and CRM</text>
<text x="1230" y="449" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">No cross-tenant visibility</text>
<rect x="90" y="610" width="300" height="110" rx="14" fill="#e6f5f1" stroke="#368779" stroke-width="2"/>
<text x="110" y="643" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">A-owned data</text>
<text x="110" y="671" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Tenant G + hospital A</text>
<text x="110" y="694" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Source remains the owner</text>
<rect x="445" y="610" width="300" height="110" rx="14" fill="#e6f5f1" stroke="#368779" stroke-width="2"/>
<text x="465" y="643" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">B-owned data</text>
<text x="465" y="671" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Tenant G + hospital B</text>
<text x="465" y="694" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Shared reads are explicit grants</text>
<rect x="800" y="610" width="300" height="110" rx="14" fill="#e6f5f1" stroke="#368779" stroke-width="2"/>
<text x="820" y="643" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">C-owned data</text>
<text x="820" y="671" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Tenant G + hospital C</text>
<text x="820" y="694" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">No discovery from A or B</text>
<rect x="1210" y="610" width="300" height="110" rx="14" fill="#e6f5f1" stroke="#368779" stroke-width="2"/>
<text x="1230" y="643" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1d3652">D-owned data</text>
<text x="1230" y="671" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Tenant H + hospital D</text>
<text x="1230" y="694" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#33465d">Independent isolation boundary</text>
<rect x="60" y="850" width="1480" height="120" rx="14" fill="#f3edff" stroke="#8663bc" stroke-width="2"/>
<text x="80" y="883" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Sharing is not a tenant-wide switch</text>
<text x="80" y="911" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Isolated / selective / approved group mode • directional • purpose-bound • revocable</text>
<text x="80" y="934" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Identity links ≠ clinical access ≠ CRM access ≠ finance / HR access</text>
<text x="80" y="957" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Tenant administrators do not automatically get access to patient records</text>
<line x1="60" y1="1020" x2="1540" y2="1020" stroke="#d5dee8"/>
<text x="60" y="1050" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#6c7b8d">HELIVANTA  /  Proposed design · 2026-10-13  /  Blue: apps   Purple: identity/policy   Teal: data   Amber: async   Dashed: secondary/future</text>
<text x="1485" y="1050" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#163c60">02 / 08</text>
</svg>