<text x="610" y="471" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Event ID • tenant • origin hospital</text>
<text x="610" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Versioned contract • inbox / outbox</text>
<rect x="1120" y="410" width="420" height="125" rx="14" fill="#edf4ff" stroke="#4975b5" stroke-width="2"/>
<text x="1140" y="443" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">PharmaConnect</text>
<text x="1140" y="471" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Validate → reserve → dispense</text>
<text x="1140" y="494" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Batch / expiry + stock ledger</text>
