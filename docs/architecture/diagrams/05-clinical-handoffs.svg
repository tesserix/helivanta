<text x="610" y="746" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Idempotent source charge lines</text>
<text x="610" y="769" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Pending charge visible on failure</text>
<rect x="1120" y="685" width="420" height="125" rx="14" fill="#e6f5f1" stroke="#368779" stroke-width="2"/>
<text x="1140" y="718" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">SupplyConnect</text>
<text x="1140" y="746" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Central stock → transit → receipt</text>
<text x="1140" y="769" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Separate ledger; reconcile variance</text>
<rect x="60" y="885" width="1480" height="90" rx="14" fill="#f0f3f7" stroke="#8d9aad" stroke-width="2"/>
<text x="80" y="918" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Clinical reality determines compensation</text>
<text x="80" y="946" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Before dispense: release reservation. After physical dispense: preserve fact; retry charge or perform an authorized return.</text>
<text x="80" y="969" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Cross-hospital referrals expose only the agreed data. Each recipient keeps its own provenance and record ownership.</text>
