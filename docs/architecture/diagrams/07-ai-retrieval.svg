<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<title>AI sees only data the current user may see.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758d"/></marker></defs>
<rect width="1600" height="1080" fill="#ffffff"/>
<rect x="0" y="0" width="1600" height="12" fill="#163c60"/>
<text x="60" y="65" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#163c60">AI sees only data the current user may see.</text>
<text x="60" y="108" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#627186">FUTURE CAPABILITY  /  Embeddings are sensitive derived data; core care works without AI</text>
<rect x="60" y="145" width="650" height="710" rx="18" fill="#f8fafc" stroke="#d0d9e4" stroke-width="2"/>
<text x="84" y="179" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#52657d">GOVERNED INGESTION</text>
<rect x="765" y="145" width="775" height="710" rx="18" fill="#f8fafc" stroke="#d0d9e4" stroke-width="2"/>
<text x="789" y="179" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#52657d">AUTHORIZED RETRIEVAL</text>
<path d="M 385 335 L 385 450" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 385 560 L 385 680" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1152 335 L 1152 450" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 805 505 L 745 505 L 745 630 L 565 630 L 565 680" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="595.4" y="605.0" width="119.2" height="22" rx="4" fill="#ffffff"/>
<text x="655.0" y="621.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52657d">filtered query</text>
<path d="M 675 735 L 805 735" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="684.3" y="710.0" width="111.39999999999999" height="22" rx="4" fill="#ffffff"/>
<text x="740.0" y="726.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52657d">candidate IDs</text>
<path d="M 1152 790 L 1152 885" fill="none" stroke="#63758d" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="95" y="225" width="580" height="110" rx="14" fill="#e6f5f1" stroke="#368779" stroke-width="2"/>
<text x="115" y="258" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Approved source records</text>
<text x="115" y="286" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Tenant + hospital + source version</text>
<text x="115" y="309" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Classification • sharing • retention</text>
<rect x="95" y="450" width="580" height="110" rx="14" fill="#fff5df" stroke="#b88b32" stroke-width="2"/>
<text x="115" y="483" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Index worker</text>
<text x="115" y="511" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Outbox trigger • approved model</text>
<text x="115" y="534" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Minimal content • policy metadata</text>
<rect x="95" y="680" width="580" height="110" rx="14" fill="#f0f3f7" stroke="#8d9aad" stroke-width="2" stroke-dasharray="8 6"/>
<text x="115" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Private Qdrant</text>
<text x="115" y="741" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Mandatory tenant / hospital payload filters</text>
<text x="115" y="764" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Derived vectors + document references</text>
<rect x="805" y="225" width="695" height="110" rx="14" fill="#edf4ff" stroke="#4975b5" stroke-width="2"/>
<text x="825" y="258" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">User request → AI gateway</text>
<text x="825" y="286" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Current actor, tenant, hospital and purpose</text>
<text x="825" y="309" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">No user/model override of scope</text>
<rect x="805" y="450" width="695" height="110" rx="14" fill="#f3edff" stroke="#8663bc" stroke-width="2"/>
<text x="825" y="483" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Authorize + retrieve candidate IDs</text>
<text x="825" y="511" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Policy computes allowed hospital/resource scope</text>
<text x="825" y="534" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Server injects filters; bounded retrieval</text>
<rect x="805" y="680" width="695" height="110" rx="14" fill="#f3edff" stroke="#8663bc" stroke-width="2"/>
<text x="825" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Reauthorize each source before content</text>
<text x="825" y="741" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Check revocation, current version and legal basis</text>
<text x="825" y="764" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Only then hydrate text from the owner</text>
<rect x="60" y="885" width="1480" height="105" rx="14" fill="#edf4ff" stroke="#4975b5" stroke-width="2"/>
<text x="80" y="918" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#1d3652">Approved model → cited draft → human review</text>
<text x="80" y="946" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Regional / contractual controls • no default training • restricted traces • delegated tools only</text>
<text x="80" y="969" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#33465d">Source tombstones block stale vectors immediately. Provider or Qdrant outage disables AI, not core care.</text>
<line x1="60" y1="1020" x2="1540" y2="1020" stroke="#d5dee8"/>
<text x="60" y="1050" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#6c7b8d">HELIVANTA  /  Proposed design · 2026-10-13  /  Blue: apps   Purple: identity/policy   Teal: data   Amber: async   Dashed: secondary/future</text>
<text x="1485" y="1050" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#163c60">07 / 08</text>
</svg>