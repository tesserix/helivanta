<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1300" height="800" fill="white"/><g font-family="Arial,sans-serif"><text x="60" y="45" font-size="25" fill="#0f172a" font-weight="700">Helivanta · Hospital-scoped patient registration</text><text x="60" y="72" font-size="14" fill="#64748b">Synthetic data only · No implicit cross-hospital access · Durable idempotency in PostgreSQL</text><line x1="280" y1="140.0" x2="340" y2="140.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="140.0" x2="620" y2="140.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="745.0" y1="180" x2="745.0" y2="270" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="560" y1="310.0" x2="620" y2="310.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="870" y1="310.0" x2="960" y2="310.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="1085.0" y1="350" x2="1085.0" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="960" y1="500.0" x2="870" y2="500.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="620" y1="500.0" x2="560" y2="500.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="340" y1="500.0" x2="280" y2="500.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="60" y="100" width="220" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="170.0" y="134.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Patient workspace</text><text x="170.0" y="156.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Next.js 16 · Tailwind 4</text><rect x="340" y="100" width="220" height="80" rx="12" fill="#f0fdfa" stroke="#0d9488"/><text x="450.0" y="134.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Valkey</text><text x="450.0" y="156.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Shared capacity budgets</text><rect x="620" y="100" width="250" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="745.0" y="134.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Patient API</text><text x="745.0" y="156.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Authenticated tenant + permission</text><rect x="620" y="270" width="250" height="80" rx="12" fill="#fff7ed" stroke="#f97316"/><text x="745.0" y="304.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Explicit hospital grant</text><text x="745.0" y="326.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Reader or registrar · checked live</text><rect x="960" y="270" width="250" height="80" rx="12" fill="#f0fdfa" stroke="#0d9488"/><text x="1085.0" y="304.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">PostgreSQL / CNPG</text><text x="1085.0" y="326.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Forced tenant + hospital RLS</text><rect x="960" y="450" width="250" height="100" rx="12" fill="#f0fdfa" stroke="#0d9488"/><text x="1085.0" y="483.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">One transaction</text><text x="1085.0" y="505.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Patient · Consent · Audit</text><text x="1085.0" y="527.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Unique request ID + MRN</text><rect x="620" y="450" width="250" height="100" rx="12" fill="#f0fdfa" stroke="#0d9488"/><text x="745.0" y="494.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Transactional outbox</text><text x="745.0" y="516.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Internal tenant / hospital / patient IDs</text><rect x="340" y="450" width="220" height="100" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="450.0" y="494.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">NATS JetStream</text><text x="450.0" y="516.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Durable acknowledged delivery</text><rect x="60" y="450" width="220" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="170.0" y="494.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Future consumers</text><text x="170.0" y="516.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Deduplicate by event ID</text><rect x="340" y="270" width="220" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6"/><text x="450.0" y="304.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Zitadel + onboarding</text><text x="450.0" y="326.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Verified organisation membership</text><rect x="60" y="660" width="500" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8"/><text x="310.0" y="689.0" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Temporal: later multi-service workflows</text><text x="310.0" y="711.0" font-size="12" font-weight="400" text-anchor="middle" fill="#0f172a">Not used for atomic patient registration</text><text x="620" y="689" font-size="13" fill="#64748b">The cache never stores clinical grants or patient records.</text><text x="620" y="711" font-size="13" fill="#64748b">Clinical access is decided from PostgreSQL on every operation.</text></g></svg>