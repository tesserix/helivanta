<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">Pharma Connect expenses and inventory audit</title><desc id="desc">Verified tenant pharmacy and outlet scopes protect immutable purchase and expense records, settlements and inventory cost audit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#547A80"/></marker></defs><rect width="1440" height="800" fill="#FFFFFF"/><g font-family="Arial,sans-serif"><text x="40" y="52" font-size="28" font-weight="700" fill="#123A40">Pharma Connect · expenses, inventory costs and audit</text><text x="40" y="85" font-size="12" font-weight="700" letter-spacing="2" fill="#547A80">SCOPE AND ACCESS</text><text x="40" y="275" font-size="12" font-weight="700" letter-spacing="2" fill="#547A80">SUPPLIER LIABILITIES AND EXPENSES</text><text x="40" y="465" font-size="12" font-weight="700" letter-spacing="2" fill="#547A80">INVENTORY COST EVIDENCE</text><path d="M340 157 H375" fill="none" stroke="#547A80" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 157 H715" fill="none" stroke="#547A80" stroke-width="2" marker-end="url(#arrow)"/><path d="M1020 157 H1055" fill="none" stroke="#547A80" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 347 H375" fill="none" stroke="#547A80" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 347 H715" fill="none" stroke="#547A80" stroke-width="2" marker-end="url(#arrow)"/><path d="M1020 347 H1055" fill="none" stroke="#547A80" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 537 H375" fill="none" stroke="#547A80" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 537 H715" fill="none" stroke="#547A80" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="100" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="58" y="135" font-size="18" font-weight="700" fill="#123A40">Tenant</text><text x="58" y="168" font-size="13" fill="#547A80">Verified session identity</text><rect x="380" y="100" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="398" y="135" font-size="18" font-weight="700" fill="#123A40">Pharmacy organization</text><text x="398" y="168" font-size="13" fill="#547A80">Independent, chain or hospital-owned</text><rect x="720" y="100" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="738" y="135" font-size="18" font-weight="700" fill="#123A40">Physical outlet</text><text x="738" y="168" font-size="13" fill="#547A80">No implicit hospital or outlet sharing</text><rect x="1060" y="100" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="1078" y="135" font-size="18" font-weight="700" fill="#123A40">Financial access</text><text x="1078" y="168" font-size="13" fill="#547A80">Route permission + current outlet grant</text><rect x="40" y="290" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="58" y="325" font-size="18" font-weight="700" fill="#123A40">Bills &amp; expenses</text><text x="58" y="358" font-size="13" fill="#547A80">Supplier reference / original document</text><rect x="380" y="290" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="398" y="325" font-size="18" font-weight="700" fill="#123A40">Immutable payable + lines</text><text x="398" y="358" font-size="13" fill="#547A80">Original costs, taxes, dates and actor</text><rect x="720" y="290" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="738" y="325" font-size="18" font-weight="700" fill="#123A40">Recorded settlements</text><text x="738" y="358" font-size="13" fill="#547A80">Payer / method / reference / recorder</text><rect x="1060" y="290" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="1078" y="325" font-size="18" font-weight="700" fill="#123A40">Amounts still owed</text><text x="1078" y="358" font-size="13" fill="#547A80">Billed − net paid − credits</text><rect x="40" y="480" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="58" y="515" font-size="18" font-weight="700" fill="#123A40">Received drugs</text><text x="58" y="548" font-size="13" fill="#547A80">Product / manufacturer lot / quantity</text><rect x="380" y="480" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="398" y="515" font-size="18" font-weight="700" fill="#123A40">Unique receipt cost link</text><text x="398" y="548" font-size="13" fill="#547A80">Net + nonrecoverable tax + landed</text><rect x="720" y="480" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="738" y="515" font-size="18" font-weight="700" fill="#123A40">Inventory audit</text><text x="738" y="548" font-size="13" fill="#547A80">One batch; missing costs clearly flagged</text><rect x="1060" y="480" width="300" height="115" rx="16" fill="#F0FAF7" stroke="#5F9E90"/><text x="1078" y="515" font-size="18" font-weight="700" fill="#123A40">Finance integration (future)</text><text x="1078" y="548" font-size="13" fill="#547A80">Reviewed posting / close / reconciliation</text><rect x="40" y="660" width="1320" height="70" rx="14" fill="#123A40"/><text x="62" y="701" font-size="17" fill="#FFFFFF">All writes: forced tenant/outlet RLS · composite references · immutable rows · database allocation guards · atomic audit + outbox</text><text x="40" y="770" font-size="14" fill="#547A80">Quarantine stock cannot dispense. Missing costs, credits or corrections withhold valuation. Records do not initiate transfers.</text></g></svg>