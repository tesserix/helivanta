<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title"><title id="title">PharmaConnect India and Pakistan supply-chain boundaries</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#547A80"/></marker></defs><rect width="1440" height="900" fill="white"/><g font-family="Arial,sans-serif"><text x="40" y="58" font-size="27" font-weight="700" fill="#123A40">PharmaConnect · India and Pakistan supply-chain boundaries</text><rect x="40" y="110" width="1360" height="255" rx="18" fill="#F8FBFC" stroke="#B6CBCD"/><text x="64" y="144" font-size="19" font-weight="700" fill="#123A40">India · INR · Asia/Kolkata · independent policy approval</text><path d="M365 255H392" stroke="#547A80" stroke-width="2" marker-end="url(#a)" /><path d="M700 255H727" stroke="#547A80" stroke-width="2" marker-end="url(#a)" /><path d="M1035 255H1062" stroke="#547A80" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="40" y="420" width="1360" height="255" rx="18" fill="#F8FBFC" stroke="#B6CBCD"/><text x="64" y="454" font-size="19" font-weight="700" fill="#123A40">Pakistan · PKR · Asia/Karachi · independent policy approval</text><path d="M365 565H392" stroke="#547A80" stroke-width="2" marker-end="url(#a)" /><path d="M700 565H727" stroke="#547A80" stroke-width="2" marker-end="url(#a)" /><path d="M1035 565H1062" stroke="#547A80" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="65" y="200" width="300" height="110" rx="14" fill="#F0FAF7" stroke="#5F9E90"/><text x="81" y="235" font-size="18" font-weight="700" fill="#123A40">Manufacturer / importer</text><text x="81" y="270" font-size="13" fill="#547A80">Own organisation and product evidence</text><rect x="400" y="200" width="300" height="110" rx="14" fill="#F0FAF7" stroke="#5F9E90"/><text x="416" y="235" font-size="18" font-weight="700" fill="#123A40">Distributor / wholesaler</text><text x="416" y="270" font-size="13" fill="#547A80">Own branches, warehouses and stock</text><rect x="735" y="200" width="300" height="110" rx="14" fill="#F0FAF7" stroke="#5F9E90"/><text x="751" y="235" font-size="18" font-weight="700" fill="#123A40">Pharmacy / outlets</text><text x="751" y="270" font-size="13" fill="#547A80">Own purchaser, pharmacist and finance</text><rect x="1070" y="200" width="300" height="110" rx="14" fill="#F0FAF7" stroke="#5F9E90"/><text x="1086" y="235" font-size="18" font-weight="700" fill="#123A40">Optional hospital affiliation</text><text x="1086" y="270" font-size="13" fill="#547A80">Ownership is not patient/data access</text><rect x="65" y="510" width="300" height="110" rx="14" fill="#F0FAF7" stroke="#5F9E90"/><text x="81" y="545" font-size="18" font-weight="700" fill="#123A40">Manufacturer / importer</text><text x="81" y="580" font-size="13" fill="#547A80">Own organisation and product evidence</text><rect x="400" y="510" width="300" height="110" rx="14" fill="#F0FAF7" stroke="#5F9E90"/><text x="416" y="545" font-size="18" font-weight="700" fill="#123A40">Distributor / wholesaler</text><text x="416" y="580" font-size="13" fill="#547A80">Own branches, warehouses and stock</text><rect x="735" y="510" width="300" height="110" rx="14" fill="#F0FAF7" stroke="#5F9E90"/><text x="751" y="545" font-size="18" font-weight="700" fill="#123A40">Pharmacy / outlets</text><text x="751" y="580" font-size="13" fill="#547A80">Own purchaser, pharmacist and finance</text><rect x="1070" y="510" width="300" height="110" rx="14" fill="#F0FAF7" stroke="#5F9E90"/><text x="1086" y="545" font-size="18" font-weight="700" fill="#123A40">Optional hospital affiliation</text><text x="1086" y="580" font-size="13" fill="#547A80">Ownership is not patient/data access</text><text x="720" y="401" text-anchor="middle" font-size="17" font-weight="700" fill="#A34D20">No automatic cross-border trading or shared country approvals</text><rect x="40" y="735" width="1360" height="100" rx="16" fill="#123A40"/><text x="64" y="761" font-size="17" fill="white">Shared platform: identity + country/versioned policy + scoped roles</text><text x="64" y="790" font-size="17" fill="white">Approved bilateral relationships · minimized directed outbox/JetStream facts · Temporal workflows</text><text x="64" y="819" font-size="17" fill="white">SupplyConnect masters + Finance posting contracts · tenant-authorized GCS / ClamAV evidence</text><text x="40" y="875" font-size="14" fill="#547A80">Target design, staged implementation. Metadata is review_required; it is not licence, tax, residency or transaction approval.</text></g></svg>