<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 810" width="1280" height="810" role="img" aria-labelledby="title desc">
  <title id="title">Private supplier premises and licence declarations</title>
  <desc id="desc">Current party authorization gates premises and licences. A PostgreSQL transaction commits guarded heads, immutable revisions, audit and outbox before the NATS relay. Declarations do not approve trading.</desc>
  <rect width="1280" height="810" fill="#f6f8fb" />
  <text x="60" y="54" font-family="Inter, Arial, sans-serif" font-size="29" fill="#172c40" font-weight="700">Private supplier registration</text>
  <text x="60" y="84" font-family="Inter, Arial, sans-serif" font-size="16" fill="#516579" font-weight="400">PharmaConnect  /  India &amp; Pakistan  /  Current implementation boundary</text>
  <rect x="50" y="280" width="1180" height="220" rx="20" fill="#e4f1ed" stroke="#83b7a9" />
  <text x="80" y="318" font-family="Inter, Arial, sans-serif" font-size="15" fill="#116252" font-weight="700">ONE POSTGRESQL TRANSACTION · FORCED TENANT / PARTY / SUBJECT RLS</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#698297" />
    </marker>
  </defs>
  <path d="M390,172.0 L475,172.0" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M805,172.0 L890,172.0" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M640,226 L640,250 L40,250 L40,404 L80,404" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M1055.0,226 L1075.0,346" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M330,404.0 L370,404.0" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M620,404.0 L660,404.0" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M910,404.0 L950,404.0" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M205.0,462 L415.0,603" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M1075.0,462 L885.0,603" fill="none" stroke="#698297" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="60" y="118" width="330" height="108" rx="14" fill="#eaf3ff" stroke="#2563a6" stroke-width="1.4" />
  <text x="78" y="149" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">Verified tenant + subject</text>
  <text x="78" y="178" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Route permission + current party grant</text>
  <text x="78" y="201" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Independent organisation; hospital optional</text>
  <rect x="475" y="118" width="330" height="108" rx="14" fill="#eaf8f4" stroke="#087f72" stroke-width="1.4" />
  <text x="493" y="149" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">Private premises</text>
  <text x="493" y="178" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Country, address, time zone, status</text>
  <text x="493" y="201" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Administrator / purchasing writes</text>
  <rect x="890" y="118" width="330" height="108" rx="14" fill="#fff5e6" stroke="#a56a16" stroke-width="1.4" />
  <text x="908" y="149" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">Declared licences</text>
  <text x="908" y="178" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Same-party premise, dates, categories</text>
  <text x="908" y="201" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Compliance also maintains declarations</text>
  <rect x="80" y="346" width="250" height="116" rx="14" fill="#ffffff" stroke="#087f72" stroke-width="1.4" />
  <text x="98" y="377" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">Guarded head</text>
  <text x="98" y="406" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">UUIDv7 + expected version</text>
  <text x="98" y="429" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Exact replay returns saved result</text>
  <rect x="370" y="346" width="250" height="116" rx="14" fill="#ffffff" stroke="#087f72" stroke-width="1.4" />
  <text x="388" y="377" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">Immutable revisions</text>
  <text x="388" y="406" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Full snapshot + actor + time</text>
  <text x="388" y="429" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Head references committed revision</text>
  <rect x="660" y="346" width="250" height="116" rx="14" fill="#ffffff" stroke="#087f72" stroke-width="1.4" />
  <text x="678" y="377" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">Append-only audit</text>
  <text x="678" y="406" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Resource IDs + changed fields</text>
  <text x="678" y="429" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">No sensitive payload in logs</text>
  <rect x="950" y="346" width="250" height="116" rx="14" fill="#ffffff" stroke="#087f72" stroke-width="1.4" />
  <text x="968" y="377" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">Transactional outbox</text>
  <text x="968" y="406" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Opaque references + version</text>
  <text x="968" y="429" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Commit with the business write</text>
  <rect x="230" y="603" width="370" height="110" rx="14" fill="#eaf3ff" stroke="#2563a6" stroke-width="1.4" />
  <text x="248" y="634" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">Private screen + history</text>
  <text x="248" y="663" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Auditor: read only; revoked grant: denied</text>
  <text x="248" y="686" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Unknown / foreign object: 404</text>
  <rect x="700" y="603" width="370" height="110" rx="14" fill="#eaf8f4" stroke="#087f72" stroke-width="1.4" />
  <text x="718" y="634" font-family="Inter, Arial, sans-serif" font-size="18" fill="#172c40" font-weight="700">NATS JetStream relay</text>
  <text x="718" y="663" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">Broker outage leaves durable pending events</text>
  <text x="718" y="686" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#40566a" font-weight="400">At-least-once delivery; no second mutation</text>
  <text x="60" y="769" font-family="Inter, Arial, sans-serif" font-size="15" fill="#9b6716" font-weight="700">DECLARATION ≠ VERIFICATION</text>
  <text x="360" y="769" font-family="Inter, Arial, sans-serif" font-size="15" fill="#516579" font-weight="400">Evidence, independent review and country trading gates remain separate requirements.</text>
</svg>