<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <title>02  /  Delegated staff administration</title>
  <desc>The employer retains staff ownership; a department or outlet receives bounded administrative authority.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60748c" />
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff" />
  <text x="50" y="73" fill="#17324f" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">02  /  Delegated staff administration</text>
  <text x="50" y="112" fill="#52657e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal">The employer retains staff ownership; a department or outlet receives bounded administrative authority.</text>
  <rect x="40" y="145" width="485" height="615" rx="12" fill="#eaf2ff" stroke="#8bafe0" />
  <text x="65" y="182" fill="#173a65" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold">EMPLOYER / HOSPITAL / CORPORATE</text>
  <rect x="555" y="145" width="485" height="615" rx="12" fill="#e6f5f0" stroke="#75b7a1" />
  <text x="580" y="182" fill="#155642" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold">DEPARTMENT / BRANCH</text>
  <rect x="1070" y="145" width="490" height="615" rx="12" fill="#f1f4f8" stroke="#adb9c9" />
  <text x="1095" y="182" fill="#37465b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold">IAM + ACCOUNTABLE REVIEWERS</text>
  <polyline points="490,270 590,270" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="504.0" y="254.0" width="72.0" height="21" fill="#ffffff" rx="3" />
  <text x="540.0" y="270.0" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">appoints</text>
  <polyline points="282,320 282,445" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="797,320 797,445" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="590,500 490,500" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="485.25" y="484.0" width="109.5" height="21" fill="#ffffff" rx="3" />
  <text x="540.0" y="500.0" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">intake policy</text>
  <polyline points="1005,270 1105,270" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="1015.25" y="254.0" width="79.5" height="21" fill="#ffffff" rx="3" />
  <text x="1055.0" y="270.0" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">nominates</text>
  <polyline points="1315,320 1315,445" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1315,555 1315,790 1140,790 1140,815" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="1279.0" y="656.5" width="72.0" height="21" fill="#ffffff" rx="3" />
  <text x="1315.0" y="672.5" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">approved</text>
  <polyline points="282,555 282,790 450,790 450,815" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="204.75" y="656.5" width="154.5" height="21" fill="#ffffff" rx="3" />
  <text x="282.0" y="672.5" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">current eligibility</text>
  <rect x="75" y="225" width="415" height="95" rx="12" fill="#eaf2ff" stroke="#8bafe0" stroke-width="1.5" />
  <text x="282.5" y="258.5" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Owner / hospital administration</text>
  <text x="282.5" y="280.5" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Creates structure and appoints leaders</text>
  <text x="282.5" y="302.5" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">No clinical access by default</text>
  <rect x="75" y="445" width="415" height="110" rx="12" fill="#eaf2ff" stroke="#8bafe0" stroke-width="1.5" />
  <text x="282.5" y="475.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">HR authority</text>
  <text x="282.5" y="497.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Owns staff records and sensitive fields</text>
  <text x="282.5" y="519.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Chooses central or delegated intake</text>
  <text x="282.5" y="541.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">A posting proposes access</text>
  <rect x="590" y="225" width="415" height="95" rx="12" fill="#e6f5f0" stroke="#75b7a1" stroke-width="1.5" />
  <text x="797.5" y="258.5" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Department / outlet staff admin</text>
  <text x="797.5" y="280.5" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Own unit only; approved HR field set</text>
  <text x="797.5" y="302.5" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Cannot widen its own delegation</text>
  <rect x="590" y="445" width="415" height="110" rx="12" fill="#e6f5f0" stroke="#75b7a1" stroke-width="1.5" />
  <text x="797.5" y="475.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Staff intake + posting</text>
  <text x="797.5" y="497.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Central review is the proposed default</text>
  <text x="797.5" y="519.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Delegated activation only by policy</text>
  <text x="797.5" y="541.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">No automatic login or role grant</text>
  <rect x="1105" y="225" width="420" height="95" rx="12" fill="#f1f4f8" stroke="#adb9c9" stroke-width="1.5" />
  <text x="1315.0" y="258.5" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Bounded access administrator</text>
  <text x="1315.0" y="280.5" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Allowlisted templates + scope ceiling</text>
  <text x="1315.0" y="302.5" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Proposes; no self-grant / self-approval</text>
  <rect x="1105" y="445" width="420" height="110" rx="12" fill="#fff4dd" stroke="#d5af56" stroke-width="1.5" />
  <text x="1315.0" y="475.0" fill="#6c4e13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Independent approval + evidence</text>
  <text x="1315.0" y="497.0" fill="#6c4e13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">IAM: current reviewer and assignment</text>
  <text x="1315.0" y="519.0" fill="#6c4e13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Clinical owner: qualification / authority</text>
  <text x="1315.0" y="541.0" fill="#6c4e13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">No administrator waiver</text>
  <rect x="305" y="815" width="990" height="85" rx="12" fill="#0f2745" stroke="#0f2745" stroke-width="1.5" />
  <text x="800.0" y="854.5" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Active scoped assignment</text>
  <text x="800.0" y="876.5" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Only after current checks and required projection acknowledgments; product reauthorizes each act</text>
  <text x="50" y="970" fill="#52657e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal">HELIVANTA  /  STAFF &amp; ACCESS DESIGN     •     06 NOV 2026     •     PROPOSED TARGET — NOT DEPLOYED</text>
</svg>