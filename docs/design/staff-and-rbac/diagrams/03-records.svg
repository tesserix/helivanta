<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img">
  <title>03  /  One owner for each record</title>
  <desc>Conceptual references across owners. No cross-module table access and no second employee master.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60748c" />
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff" />
  <text x="50" y="73" fill="#17324f" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold">03  /  One owner for each record</text>
  <text x="50" y="112" fill="#52657e" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal">Conceptual references across owners. No cross-module table access and no second employee master.</text>
  <rect x="40" y="145" width="485" height="620" rx="12" fill="#eaf2ff" stroke="#8bafe0" />
  <text x="65" y="182" fill="#173a65" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold">ORGANIZATION STRUCTURE</text>
  <rect x="555" y="145" width="485" height="620" rx="12" fill="#e6f5f0" stroke="#75b7a1" />
  <text x="580" y="182" fill="#155642" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold">WORKFORCE + CLINICAL EVIDENCE</text>
  <rect x="1070" y="145" width="490" height="620" rx="12" fill="#f1f4f8" stroke="#adb9c9" />
  <text x="1095" y="182" fill="#37465b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold">IAM + PRODUCT OWNERS</text>
  <polyline points="490,275 590,275" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="489.0" y="259.0" width="102.0" height="21" fill="#ffffff" rx="3" />
  <text x="540.0" y="275.0" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">posting unit</text>
  <polyline points="1005,275 1105,275" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="1007.75" y="259.0" width="94.5" height="21" fill="#ffffff" rx="3" />
  <text x="1055.0" y="275.0" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">eligibility</text>
  <polyline points="282,325 282,460" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="797,325 797,460" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="1315,325 1315,460" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="1256.5" y="376.5" width="117.0" height="21" fill="#ffffff" rx="3" />
  <text x="1315.0" y="392.5" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">action + scope</text>
  <polyline points="1005,515 1105,515" fill="none" stroke="#60748c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5" />
  <rect x="989.0" y="499.0" width="132.0" height="21" fill="#ffffff" rx="3" />
  <text x="1055.0" y="515.0" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">current evidence</text>
  <rect x="75" y="225" width="415" height="100" rx="12" fill="#eaf2ff" stroke="#8bafe0" stroke-width="1.5" />
  <text x="282.5" y="261.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Canonical structure</text>
  <text x="282.5" y="283.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Tenant / legal employer / real hospital</text>
  <text x="282.5" y="305.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Department / sub-unit / effective version</text>
  <rect x="75" y="460" width="415" height="110" rx="12" fill="#eaf2ff" stroke="#8bafe0" stroke-width="1.5" />
  <text x="282.5" y="490.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Product responsibility binding</text>
  <text x="282.5" y="512.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Department runs named hospital outlets</text>
  <text x="282.5" y="534.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Service relationships are separate</text>
  <text x="282.5" y="556.0" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">No independent-provider inheritance</text>
  <rect x="590" y="225" width="415" height="100" rx="12" fill="#e6f5f0" stroke="#75b7a1" stroke-width="1.5" />
  <text x="797.5" y="261.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Employment + dated posting</text>
  <text x="797.5" y="283.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Staff ID belongs to employer scope</text>
  <text x="797.5" y="305.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Hospital or proposed independent scope</text>
  <rect x="590" y="460" width="415" height="110" rx="12" fill="#e6f5f0" stroke="#75b7a1" stroke-width="1.5" />
  <text x="797.5" y="490.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Reviewed link + current evidence</text>
  <text x="797.5" y="512.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Subject link is not a grant</text>
  <text x="797.5" y="534.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Credential / privilege / designation</text>
  <text x="797.5" y="556.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Each fact has a current accountable owner</text>
  <rect x="1105" y="225" width="420" height="100" rx="12" fill="#f1f4f8" stroke="#adb9c9" stroke-width="1.5" />
  <text x="1315.0" y="261.0" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">IAM assignment + role version</text>
  <text x="1315.0" y="283.0" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Subject + tenant + exact scope + validity</text>
  <text x="1315.0" y="305.0" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Independent approval + source + epoch</text>
  <rect x="1105" y="460" width="420" height="110" rx="12" fill="#f1f4f8" stroke="#adb9c9" stroke-width="1.5" />
  <text x="1315.0" y="490.0" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">Product business record</text>
  <text x="1315.0" y="512.0" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">PharmaConnect: pharmacy / outlet / stock</text>
  <text x="1315.0" y="534.0" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Clinical owner: prescription / encounter</text>
  <text x="1315.0" y="556.0" fill="#37465b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Owner validates action and object state</text>
  <rect x="180" y="825" width="1240" height="80" rx="12" fill="#0f2745" stroke="#0f2745" stroke-width="1.5" />
  <text x="800.0" y="862.0" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">History and disclosure follow ownership</text>
  <text x="800.0" y="884.0" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Keep scoped references and versions; protect HR / PHI fields; sensitive acts and reads carry attributable audit</text>
  <text x="50" y="970" fill="#52657e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal">HELIVANTA  /  STAFF &amp; ACCESS DESIGN     •     06 NOV 2026     •     PROPOSED TARGET — NOT DEPLOYED</text>
</svg>