  <text x="800.0" y="578.5" fill="#ffffff" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Commit business transition + audit + outbox atomically</text>
  <rect x="60" y="745" width="440" height="110" rx="12" fill="#fceceb" stroke="#d58e89" stroke-width="1.5" />
  <text x="280.0" y="786.0" fill="#7e302b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">DENY</text>
  <text x="280.0" y="808.0" fill="#7e302b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">401: no identity   |   404: invisible object</text>
  <text x="280.0" y="830.0" fill="#7e302b" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">403: in-scope permission / condition absent</text>
  <rect x="580" y="745" width="440" height="110" rx="12" fill="#fff4dd" stroke="#d5af56" stroke-width="1.5" />
