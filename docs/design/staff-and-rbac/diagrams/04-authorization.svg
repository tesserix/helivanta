  <text x="800.0" y="675.0" fill="#52657e" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14">required dependency down</text>
  <rect x="60" y="210" width="310" height="135" rx="12" fill="#eaf2ff" stroke="#8bafe0" stroke-width="1.5" />
  <text x="215.0" y="263.5" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">1  Identity and context</text>
  <text x="215.0" y="285.5" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Verified session / current membership</text>
  <text x="215.0" y="307.5" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Global API → owning product</text>
  <rect x="450" y="210" width="310" height="135" rx="12" fill="#eaf2ff" stroke="#8bafe0" stroke-width="1.5" />
  <text x="605.0" y="263.5" fill="#173a65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">2  Entitlement and scope</text>
