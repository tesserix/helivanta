  <text x="800.0" y="808.0" fill="#6c4e13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">503: required authority cannot be verified</text>
  <text x="800.0" y="830.0" fill="#6c4e13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">No stale cached positive fallback</text>
  <rect x="1100" y="745" width="440" height="110" rx="12" fill="#e6f5f0" stroke="#75b7a1" stroke-width="1.5" />
  <text x="1320.0" y="786.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold">ALLOW + AUDIT</text>
  <text x="1320.0" y="808.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Current approved action in current scope</text>
  <text x="1320.0" y="830.0" fill="#155642" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal">Immutable evidence for consequential acts</text>
