-size="16" font-weight="600">PharmaConnect outlet / branch</text><text x="528.0" y="333.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">SOURCE STOCK OWNER: PharmaConnect</text><text x="528.0" y="357.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Hospital-operated or independently owned</text><rect x="980.0" y="275.0" width="420.0" height="105.0" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="998.0" y="309.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">SupplyConnect registered premise</text><text x="998.0" y="333.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">SOURCE STOCK OWNER: SupplyConnect</text><text x="998.0" y="357.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Exact legal party, location and activity</text><rect x="40.0" y="425.0" width="420.0" height="105.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="58.0" y="459.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">Published hospital recipient group</text><text x="58.0" y="483.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Procurement / receiving / finance</text><text x="58.0" y="507.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Direct named hospital Staff only</text><rect x="40.0" y="580.0" width="420.0" height="110.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="58.0" y="616.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">IAM membership candidate</text><text x="58.0" y="640.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Nominate → independent review → approve</text><text x="58.0" y="664.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Withdrawal / rejection / suspension + receipts</text><rect x="510.0" y="425.0" width="890.0" height="105.0" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="528.0" y="459.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">BILATERAL RELATIONSHIP — consuming work pending</text><text x="528.0" y="483.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Exact parties + source/destination locations + reviewed licence/activity/category evidence</text><text x="528.0" y="507.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">India: Maharashtra IN-MH and Odisha IN-OD; each jurisdiction assessed independently</text><rect x="510.0" y="580.0" width="890.0" height="110.0" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="528.0" y="616.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">SHARED IAM EXTERNAL GRANT — consuming work pending</text><text x="528.0" y="640.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Named user or hospital-published group; both-party consent</text><text x="528.0" y="664.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Exact purpose / actions / fields / location / validity ceiling</text><rect x="40.0" y="745.0" width="1360.0" height="95.0" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="58.0" y="786.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">EVERY ACCESS: current session + home Staff/link/generation + membership + grant + relationship</text><text x="58.0" y="810.1" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Source owner checks audience, purpose, participating object and allowed fields. Unavailable authority denies.</text><rect x="40.0" y="885.0" width="1360.0" height="110.0" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="58.0" y="921.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600">TRADE HANDOFF — consuming work pending</text><text x="58.0" y="945.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Hospital order → source-owner dispatch → receiving-owner receipt / discrepancy / quarantine</text><text x="58.0" y="969.6" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Invoices, credits and settlement stay with their financial owners. Sharing never moves stock or money.</text><text x="40" y="1030" font-family="Arial,sans-serif" font-size="13" fill="#475569">Solid: ownership and membership candidate. Dashed: consuming integration remains pending. No production or legal readiness implied.</text></svg>