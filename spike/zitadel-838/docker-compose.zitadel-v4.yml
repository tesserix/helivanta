name: hms-spike-zitadel-v4
# Spike scaffolding for issue #838's v4.15.3 re-verification — NOT wired into
# `make up` / the real dev stack. Runs alongside the existing hms-dev stack
# without touching it: its own postgres, its own ports (shifted again from
# both hms-dev and the v2.65.1 spike stack to avoid collisions if both are
# ever brought up at once — 15434/20081/20082).
#
# Two variants of the login front door are exercised against this same core:
#   1. Legacy bundled login (`/ui/login` served by core itself) — the
#      default here, LOGINV2_REQUIRED left at "false".
#   2. Separate `zitadel-login` service (stock `ghcr.io/zitadel/zitadel-login`
#      — NOT the org's custom `tesserix/third-party/zitadel-login` build,
#      which lives in a private registry this spike could not and did not
#      try to pull) — the `zitadel-login` service below, brought up only
#      when `LOGINV2_REQUIRED=true` is set for the core (see spike doc for
#      the exact toggle commands used).
#
# v4 requires PostgreSQL 17 (CockroachDB support was dropped); the v2.65.1
# spike used postgres:16-alpine and that is a real, load-bearing difference,
# not a copy-paste artifact.
services:
  zitadel-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    ports: ["15434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - zitadel_v4_pgdata:/var/lib/postgresql/data

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.15.3
    restart: unless-stopped
    command: >
      start-from-init
      --masterkey "SpikeMasterKeyV4Exactly32BytesXX"
      --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "20081"
      # Left false for the legacy-login baseline run (P0). Flipped to
      # "true" for the P1 zitadel-login-service run — see spike doc for the
      # exact sequence, since this requires a running instance to toggle
      # via the Console/API, not just a fresh boot with it pre-set.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: hms-spike-v4
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: spike-admin@hms-spike-v4.localhost
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: SpikeAdminPassw0rd!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
    # No direct host port publish here — see zitadel-proxy below. This
    # spike's P0 (legacy-login) run was captured against a version of
    # this file that DID publish 20081 directly (before the login-service
    # profile existed); the doc records that run's output verbatim. This
    # file now always fronts core with Caddy, on the same host port, so
    # re-running the P0 baseline against this exact file still works
    # identically — Caddy forwards everything except /ui/v2/login/* to
    # core unchanged.
    expose: ["8080"]
    depends_on:
      zitadel-db:
        condition: service_healthy
    healthcheck:
      # NOT VERIFIED root cause: `/app/zitadel ready` (with or without
      # `--config`) reports "not ready" against this exact instance even
      # while it demonstrably serves real traffic (`curl .../debug/healthz`
      # returns "ok" throughout) — a real behavioural difference from the
      # v2.65.1 compose file, where the equivalent check reported
      # "Up (healthy)". The image is distroless (no shell, no curl/wget),
      # so there is no straightforward alternative CMD here; this
      # healthcheck is left in place, documented as unreliable, and
      # `docker compose up` output / `debug/healthz` was polled from the
      # host instead of trusting `docker compose ps` in this spike.
      test: ["CMD", "/app/zitadel", "ready", "--config", "/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Stock upstream login UI, brought up with `--profile login-service`
  # (`docker compose -f docker-compose.zitadel-v4.yml --profile login-service up -d`).
  # Requires a PAT for a machine user holding the instance-level
  # IAM_LOGIN_CLIENT role at ./login-client.pat — minted against the
  # running core (POST /admin/v1/members with roles: ["IAM_LOGIN_CLIENT"]),
  # so this service cannot come up on the very first boot; see spike doc
  # P1 section for the exact bootstrap order used and why
  # `ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH` (the official compose's
  # first-boot shortcut) was not used here.
  #
  # NOT VERIFIED: the org's actual login image
  # (tesserix/third-party/zitadel-login:v4.15.3-aurora.1, private
  # registry). This is the stock ghcr.io/zitadel/zitadel-login image
  # only — a real, recorded gap, not glossed over.
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.15.3
    restart: unless-stopped
    profiles: ["login-service"]
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /run/secrets/login-client.pat
    volumes:
      - ./login-client.pat:/run/secrets/login-client.pat:ro
    depends_on:
      zitadel:
        condition: service_started

  # Minimal stand-in for the official compose's Traefik reverse proxy
  # (github.com/zitadel/zitadel deploy/compose/docker-compose.yml): v4's
  # split architecture requires core and zitadel-login to be served under
  # ONE origin, because the browser's redirect target is built from
  # ZITADEL_EXTERNALDOMAIN/PORT with no way to know two backend processes
  # are involved (confirmed the hard way in this spike: without a proxy,
  # `/ui/v2/login/*` 404s straight from core). Always up — not
  # profile-gated — so the same host port (20081) serves both the P0
  # legacy-login baseline (Caddy simply forwards everything to core,
  # zitadel-login never in the request path) and the P1 login-service run
  # (once that profile is also brought up and LOGINV2_REQUIRED is flipped
  # to true via the API).
  zitadel-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["20081:8080"]
    volumes:
      - ./Caddyfile.v4-login:/etc/caddy/Caddyfile:ro
    depends_on:
      # service_started, not service_healthy: the zitadel healthcheck
      # above is documented as unreliable in this setup (reports "not
      # ready" even while serving real traffic) — depending on it would
      # block this proxy forever. Caddy itself retries backend
      # connections, so this is not a race in practice.
      zitadel:
        condition: service_started

volumes:
  zitadel_v4_pgdata:
