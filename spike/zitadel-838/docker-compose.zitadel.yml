name: hms-spike-zitadel
# Spike scaffolding for issue #838 — NOT wired into `make up` / the real dev
# stack. Runs alongside the existing hms-dev stack without touching it: its
# own postgres, its own ports, both host-side ports shifted per the HMS_*
# convention to stay clear of 15432 (hms-dev postgres) and 19099 (GIP
# emulator). Throwaway; delete after the spike doc is written, or keep for
# reference only.
services:
  zitadel-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    ports: ["15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - zitadel_pgdata:/var/lib/postgresql/data

  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.65.1
    restart: unless-stopped
    command: >
      start-from-init
      --masterkey "SpikeMasterKey32BytesLongXXXXXXX"
      --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "20080"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: hms-spike
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: spike-admin@hms-spike.localhost
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: SpikeAdminPassw0rd!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
    ports: ["20080:8080"]
    depends_on:
      zitadel-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready", "--config", "/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  zitadel_pgdata:
